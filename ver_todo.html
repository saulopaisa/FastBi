<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bingo Pro - Cartones</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0b0f1a;
            --sidebar-bg: #16213e;
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --text-dark: #1e293b;
            --red: #ff4d4d;
            --gold: #ffb703;
            --success: #10b981;
            --blue: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-white);
            min-height: 100vh;
            padding: 15px;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(180deg, var(--sidebar-bg), #0f172a);
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #2d3436;
        }

        .header h1 { color: var(--red); font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 5px; }
        .header p { color: var(--text-gray); font-size: 0.8rem; }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--sidebar-bg);
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #2d3436;
            cursor: pointer;
            transition: all 0.3s;
        }
        .stat-card:hover { border-color: var(--gold); }
        .stat-card.activo { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,183,3,0.3); }
        .stat-card .stat-numero { font-size: 1.8rem; font-weight: 900; }
        .stat-card .stat-label { font-size: 0.75rem; color: var(--text-gray); margin-top: 5px; }
        .stat-card:nth-child(1) .stat-numero { color: #3b82f6; }
        .stat-card:nth-child(2) .stat-numero { color: #10b981; }
        .stat-card:nth-child(3) .stat-numero { color: var(--gold); }

        .filtros { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filtros input, .filtros select {
            padding: 10px 15px; border-radius: 8px;
            border: 2px solid #2d3748; background: #1e293b;
            color: white; font-size: 0.85rem;
        }
        .filtros input { flex: 1; min-width: 150px; }
        .filtros input::placeholder { color: #64748b; }
        .filtros select { cursor: pointer; }
        .filtros input:focus, .filtros select:focus { outline: none; border-color: var(--blue); }

        .cartones-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .carton-card {
            background: white;
            color: var(--text-dark);
            border-radius: 12px;
            padding: 15px;
            border-left: 5px solid var(--blue);
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .carton-card:hover { transform: translateY(-3px); }
        .carton-card.asignado { border-left-color: var(--gold); }
        .carton-card.usado { border-left-color: #ef4444; opacity: 0.7; }

        .carton-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .carton-numero { font-size: 1.1rem; font-weight: 900; color: var(--red); }
        .carton-estado {
            font-size: 0.65rem; padding: 3px 10px; border-radius: 15px;
            font-weight: bold; text-transform: uppercase;
        }
        .estado-disponible { background: #dcfce7; color: #166534; }
        .estado-asignado { background: #fef3c7; color: #92400e; }
        .estado-usado { background: #fee2e2; color: #991b1b; }

        .carton-tabla { width: 100%; border-collapse: collapse; margin-bottom: 5px; }
        .carton-tabla th { background: #ff4d4d; color: white; padding: 5px; font-size: 0.65rem; border: 1px solid #e2e8f0; }
        .carton-tabla td { padding: 5px; border: 1px solid #e2e8f0; text-align: center; font-weight: bold; font-size: 0.75rem; }
        .carton-tabla td.free { background: #fef3c7; font-size: 0.8rem; }

        .sin-cartones { text-align: center; padding: 50px 20px; color: var(--text-gray); font-size: 1.1rem; grid-column: 1 / -1; }
        .sin-cartones .icono { font-size: 3.5rem; margin-bottom: 15px; }

        @media (max-width: 600px) {
            .stats-container { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .cartones-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
            .header h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎱 BINGO</h1>
        <p>Selecciona tus cartones favoritos</p>
    </div>

    <div class="stats-container">
        <div class="stat-card activo" onclick="filtrarPorEstado('todos')" id="statTotalCard">
            <div class="stat-numero" id="statTotal">0</div>
            <div class="stat-label">Total</div>
        </div>
        <div class="stat-card" onclick="filtrarPorEstado('disponible')" id="statDisponibleCard">
            <div class="stat-numero" id="statDisponibles">0</div>
            <div class="stat-label">🟢 Disponibles</div>
        </div>
        <div class="stat-card" onclick="filtrarPorEstado('asignado')" id="statAsignadoCard">
            <div class="stat-numero" id="statAsignados">0</div>
            <div class="stat-label">🟡 Asignados</div>
        </div>
    </div>

    <div class="filtros">
        <input type="text" id="buscarCarton" placeholder="🔍 Buscar por número..." oninput="filtrarCartones()">
        <select id="filtroEstado" onchange="filtrarCartones()">
            <option value="todos">Todos</option>
            <option value="disponible">🟢 Disponibles</option>
            <option value="asignado">🟡 Asignados</option>
            <option value="usado">🔴 Usados</option>
        </select>
    </div>

    <div class="cartones-grid" id="cartonesGrid">
        <div class="sin-cartones"><div class="icono">🎫</div><p>Cargando cartones...</p></div>
    </div>

    <script>
        // ============ CONFIGURACIÓN SUPABASE ============
        const SUPABASE_URL = 'https://yoakkyizazpyboxqkuhg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvYWtreWl6YXpweWJveHFrdWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDMyNjUsImV4cCI6MjEwMjM3OTI2NX0.a99WU6PvuwwhBpf-PCodZ-gfiFM-dxEvq245_SB7i3U';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============ OBTENER SALA (oculta del usuario) ============
        function obtenerSalaDeURL() {
            const params = new URLSearchParams(window.location.search);
            const sala = params.get('s') || params.get('sala') || localStorage.getItem('salaActiva') || 'bingodefault';
            return sala;
        }

        const SALA_ID = obtenerSalaDeURL();
        let todosLosCartones = [];

        console.log('📁 Cargando cartones...');

        // ============ CARGAR CARTONES ============
        async function cargarCartones() {
            try {
                const { data, error } = await supabaseClient
                    .from('cartones')
                    .select('*')
                    .eq('sala_id', SALA_ID)
                    .order('numero');

                if (error) throw error;

                todosLosCartones = data || [];
                actualizarStats();
                filtrarCartones();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('cartonesGrid').innerHTML = 
                    '<div class="sin-cartones"><div class="icono">❌</div><p>Error al cargar cartones</p></div>';
            }
        }

        // ============ ESCUCHAR CAMBIOS ============
        function escucharCambios() {
            supabaseClient.channel('ver-todo-' + SALA_ID)
                .on('postgres_changes', { 
                    event: '*', 
                    schema: 'public', 
                    table: 'cartones', 
                    filter: 'sala_id=eq.' + SALA_ID 
                }, function() {
                    cargarCartones();
                })
                .subscribe();
        }

        // ============ STATS ============
        function actualizarStats() {
            document.getElementById('statTotal').textContent = todosLosCartones.length;
            document.getElementById('statDisponibles').textContent = todosLosCartones.filter(function(c) { return c.estado === 'disponible'; }).length;
            document.getElementById('statAsignados').textContent = todosLosCartones.filter(function(c) { return c.estado === 'asignado'; }).length;
        }

        // ============ FILTRAR ============
        function filtrarPorEstado(estado) {
            document.getElementById('filtroEstado').value = estado;
            document.querySelectorAll('.stat-card').forEach(function(c) { c.classList.remove('activo'); });
            if (estado === 'todos') document.getElementById('statTotalCard').classList.add('activo');
            else if (estado === 'disponible') document.getElementById('statDisponibleCard').classList.add('activo');
            else if (estado === 'asignado') document.getElementById('statAsignadoCard').classList.add('activo');
            filtrarCartones();
        }

        function filtrarCartones() {
            const busqueda = document.getElementById('buscarCarton').value.toLowerCase();
            const estado = document.getElementById('filtroEstado').value;

            const filtrados = todosLosCartones.filter(function(c) {
                const matchBusqueda = !busqueda || String(c.numero || '').includes(busqueda);
                const matchEstado = estado === 'todos' || c.estado === estado;
                return matchBusqueda && matchEstado;
            });

            mostrarCartones(filtrados);
        }

        // ============ MOSTRAR CARTONES (sin sala, sin nombres) ============
        function mostrarCartones(cartones) {
            const grid = document.getElementById('cartonesGrid');

            if (cartones.length === 0) {
                grid.innerHTML = '<div class="sin-cartones"><div class="icono">🔍</div><p>No se encontraron cartones</p></div>';
                return;
            }

            grid.innerHTML = '';

            cartones.forEach(function(c) {
                const card = document.createElement('div');
                card.className = 'carton-card ' + 
                    (c.estado === 'asignado' ? 'asignado' : '') + 
                    (c.estado === 'usado' ? 'usado' : '');

                let tablaHTML = '<table class="carton-tabla"><tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr>';
                if (c.carton) {
                    for (let f = 0; f < 5; f++) {
                        tablaHTML += '<tr>';
                        ['B','I','N','G','O'].forEach(function(l) {
                            const valor = c.carton[l][f];
                            const centro = (l === 'N' && f === 2);
                            tablaHTML += '<td class="' + (centro ? 'free' : '') + '">' + (centro ? '⭐' : valor) + '</td>';
                        });
                        tablaHTML += '</tr>';
                    }
                }
                tablaHTML += '</table>';

                card.innerHTML = 
                    '<div class="carton-header">' +
                    '<span class="carton-numero"># ' + (c.numero || '?') + '</span>' +
                    '<span class="carton-estado estado-' + (c.estado || 'disponible') + '">' + (c.estado || 'disponible') + '</span>' +
                    '</div>' +
                    tablaHTML;

                grid.appendChild(card);
            });
        }

        // ============ INICIAR ============
        document.addEventListener('DOMContentLoaded', function() {
            cargarCartones();
            escucharCambios();
        });
    </script>
</body>
</html>
