<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Bingo Pro - Generar Cartones</title>
    <link rel="stylesheet" href="generar.css">
</head>
<body>
    <!-- HEADER -->
    <div class="app-header">
        <h1>🎫 GENERAR CARTONES</h1>
        <div class="header-actions">
            <button class="btn-header-icon" onclick="location.href='ruleta.html'">🎲</button>
            <span class="sala-badge" id="salaDisplay">-</span>
        </div>
    </div>

    <!-- CONTENIDO -->
    <div class="app-content">
        <!-- Panel Generar -->
        <div class="panel-card">
            <h3>🆕 GENERAR</h3>
            <div class="input-row">
                <input type="number" id="cantidadGenerar" value="10" min="1" max="500" placeholder="Cantidad">
                <button onclick="generarCartones()" class="btn btn-generar">🎲 GENERAR</button>
            </div>
            <div class="btn-row">
                <button onclick="guardarEnFirebase()" class="btn btn-guardar">💾 GUARDAR</button>
                <button onclick="importarDesdeFirebase()" class="btn btn-importar">📥 IMPORTAR</button>
            </div>
        </div>

        <!-- Panel Asignar -->
        <div class="panel-card">
            <h3>👤 ASIGNAR</h3>
            <div class="input-row">
                <input type="text" id="nombreJugador" placeholder="Nombre del jugador">
                <select id="cantidadAsignar">
                    <option value="1">1 cartón</option>
                    <option value="2">2 cartones</option>
                </select>
                <button onclick="asignarCartones()" class="btn btn-asignar">✅</button>
            </div>
            <div class="btn-row">
                <button onclick="generarLinkJugador()" class="btn btn-link">🔗 LINK JUGADOR</button>
                <button onclick="imprimirCartones()" class="btn btn-pdf">🖨️ IMPRIMIR</button>
            </div>
        </div>

        <!-- Info -->
        <div class="info-bar">
            <span>Total: <strong id="totalCartones">0</strong> cartones</span>
            <span>Asignados: <strong id="totalAsignados">0</strong></span>
            <span>Disponibles: <strong id="totalDisponibles">0</strong></span>
        </div>

        <!-- Grid de cartones -->
        <div class="cartones-grid" id="cartonesGrid">
            <p class="placeholder">Genera o importa cartones para verlos aquí</p>
        </div>
    </div>

    <!-- Modal Link -->
    <div class="modal-overlay" id="modalLink">
        <div class="modal-content">
            <h3>🔗 LINK PARA JUGADOR</h3>
            <p style="font-size:0.8em;color:#94a3b8;">Comparte este enlace con el jugador</p>
            <div class="link-box" id="linkGenerado"></div>
            <button onclick="copiarLink()" class="btn btn-link">📋 COPIAR</button>
            <button onclick="cerrarModal('modalLink')" class="btn btn-cerrar">CERRAR</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOHYo0w41dV6TRarAaGt58Zxn4o47dNUE",
            authDomain: "bingofast.firebaseapp.com",
            databaseURL: "https://bingofast-default-rtdb.firebaseio.com",
            projectId: "bingofast",
            storageBucket: "bingofast.firebasestorage.app",
            messagingSenderId: "473863283329",
            appId: "1:473863283329:web:2c4bf96de167d105fa6380"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();
        
        var SALA_ID = localStorage.getItem('salaActiva') || 'bingo-default';
        document.getElementById('salaDisplay').textContent = SALA_ID;
    </script>
    
    <script src="generar.js"></script>
    <script src="generar-movil.js"></script>
</body>
</html>
