<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Bingo Pro - Generar Cartones</title>
    <link rel="stylesheet" href="generar.css">
</head>
<body>
    <!-- HEADER -->
    <div class="app-header">
        <h1>🎫 GENERAR CARTONES</h1>
        <div class="header-actions">
            <button class="btn-header-icon" onclick="location.href='ruleta.html'" title="Ir a la ruleta">🎲</button>
            <button class="btn-header-icon" onclick="location.href='jugador.html'" title="Vista del jugador">👤</button>
            <span class="sala-badge" id="salaDisplay">-</span>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="app-content">
        
        <!-- Panel Generar -->
        <div class="panel-card">
            <h3>🆕 GENERAR CARTONES</h3>
            <div class="input-row">
                <input type="number" id="cantidadGenerar" value="10" min="1" max="500" placeholder="Cantidad de cartones">
                <button onclick="generarCartones()" class="btn btn-generar">🎲 GENERAR</button>
            </div>
            <div class="btn-row">
                <button onclick="guardarEnFirebase()" class="btn btn-guardar">💾 GUARDAR EN FIREBASE</button>
                <button onclick="importarDesdeFirebase()" class="btn btn-importar">📥 IMPORTAR DESDE FIREBASE</button>
            </div>
        </div>

        <!-- Panel Asignar -->
        <div class="panel-card">
            <h3>👤 ASIGNAR CARTONES</h3>
            <div class="input-row">
                <input type="text" id="nombreJugador" placeholder="Nombre del jugador">
                <select id="cantidadAsignar">
                    <option value="1">1 cartón</option>
                    <option value="2">2 cartones</option>
                </select>
                <button onclick="asignarCartones()" class="btn btn-asignar">✅ ASIGNAR</button>
            </div>
            <div class="btn-row">
                <button onclick="generarLinkJugador()" class="btn btn-link">🔗 GENERAR LINK PARA JUGADOR</button>
                <button onclick="imprimirCartones()" class="btn btn-pdf">🖨️ IMPRIMIR / PDF</button>
            </div>
            <div class="btn-row" style="margin-top:6px;">
                <button onclick="exportarCartones()" class="btn btn-importar" style="font-size:0.7em;">📤 EXPORTAR JSON</button>
                <button onclick="importarCopiaSeguridad()" class="btn btn-guardar" style="font-size:0.7em;">📥 IMPORTAR JSON</button>
            </div>
        </div>

        <!-- Panel Buscador -->
        <div class="panel-card">
            <h3>🔍 BUSCAR CARTÓN</h3>
            <div class="input-row">
                <input type="text" id="buscarCarton" placeholder="# número o nombre del jugador" oninput="buscarCarton()">
            </div>
            <div id="resultadosBusqueda" style="max-height:200px;overflow-y:auto;margin-top:8px;">
                <p style="color:#94a3b8;text-align:center;font-size:0.8em;padding:10px;">Escribe para buscar cartones</p>
            </div>
        </div>

        <!-- Info Bar -->
        <div class="info-bar">
            <span>📋 Total: <strong id="totalCartones">0</strong></span>
            <span>👤 Asignados: <strong id="totalAsignados">0</strong></span>
            <span>📋 Disponibles: <strong id="totalDisponibles">0</strong></span>
        </div>

        <!-- Grid de Cartones -->
        <div class="cartones-grid" id="cartonesGrid">
            <p class="placeholder">Genera o importa cartones para verlos aquí</p>
        </div>
    </div>

    <!-- Modal Link -->
    <div class="modal-overlay" id="modalLink">
        <div class="modal-content">
            <h3>🔗 LINK PARA EL JUGADOR</h3>
            <p style="font-size:0.8em;color:#94a3b8;margin-bottom:10px;">
                Comparte este enlace con el jugador.<br>
                Podrá ver sus cartones y jugar al bingo.
            </p>
            <div class="link-box" id="linkGenerado"></div>
            <button onclick="copiarLink()" class="btn btn-link">📋 COPIAR LINK</button>
            <button onclick="cerrarModal('modalLink')" class="btn btn-cerrar" style="margin-top:8px;">CERRAR</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAOHYo0w41dV6TRarAaGt58Zxn4o47dNUE",
            authDomain: "bingofast.firebaseapp.com",
            databaseURL: "https://bingofast-default-rtdb.firebaseio.com",
            projectId: "bingofast",
            storageBucket: "bingofast.firebasestorage.app",
            messagingSenderId: "473863283329",
            appId: "1:473863283329:web:2c4bf96de167d105fa6380"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();
        
        // Obtener sala activa
        var SALA_ID = localStorage.getItem('salaActiva') || 'bingo-default';
        document.getElementById('salaDisplay').textContent = SALA_ID;
        console.log('🔥 Firebase listo - Sala:', SALA_ID);
    </script>
    
    <script src="generar.js"></script>
    <script src="generar-movil.js"></script>
</body>
</html>
