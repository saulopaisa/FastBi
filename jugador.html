<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Multijugador - FastBi</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --dark: #2C3E50;
            --light: #ECF0F1;
            --success: #2ECC71;
            --warning: #F39C12;
            --danger: #E74C3C;
            --bingo-gold: #FFD700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Modo oscuro */
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        body.dark-mode .container {
            background: rgba(30, 30, 50, 0.95);
            color: #fff;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        /* Estado de conexión */
        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin: 10px 0;
        }

        .connection-status.online {
            background: #d4edda;
            color: #155724;
        }

        .connection-status.offline {
            background: #f8d7da;
            color: #721c24;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .online .status-dot {
            background: #28a745;
            animation: pulse 2s infinite;
        }

        .offline .status-dot {
            background: #dc3545;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Panel de control */
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        body.dark-mode .panel-section {
            background: #2d2d44;
        }

        .panel-section h2 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        /* Botones */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Input estilizado */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--dark);
            font-weight: 500;
        }

        body.dark-mode .input-group label {
            color: #fff;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Cartón de Bingo */
        .bingo-card {
            background: white;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 500px;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        .bingo-card.winner {
            animation: winGlow 1s infinite;
            box-shadow: 0 0 30px gold;
        }

        @keyframes winGlow {
            0%, 100% { box-shadow: 0 0 10px gold; }
            50% { box-shadow: 0 0 30px gold, 0 0 60px gold; }
        }

        .bingo-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 5px;
        }

        .bingo-header-cell {
            background: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.5em;
            border-radius: 10px;
        }

        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .bingo-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        body.dark-mode .bingo-cell {
            background: #3d3d5c;
            border-color: #555;
        }

        .bingo-cell:hover {
            background: #e3f2fd;
            transform: scale(1.05);
        }

        .bingo-cell.marked {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .bingo-cell.marked::after {
            content: '✓';
            position: absolute;
            font-size: 0.7em;
            top: 5px;
            right: 5px;
        }

        .bingo-cell.free {
            background: var(--bingo-gold);
            color: var(--dark);
            font-weight: bold;
        }

        .bingo-cell.numero-cantado {
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Últimos números */
        .last-numbers {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .number-ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
            animation: bounceIn 0.5s;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Chat */
        .chat-container {
            margin-top: 20px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        body.dark-mode .chat-container {
            background: #2d2d44;
        }

        .chat-messages {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .chat-message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
        }

        /* Modal de confirmación */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            animation: modalIn 0.3s;
        }

        @keyframes modalIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Confeti */
        .confetti {
            position: fixed;
            top: -10px;
            animation: confettiFall 3s linear;
        }

        @keyframes confettiFall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .control-panel {
                grid-template-columns: 1fr;
            }
            
            .bingo-cell {
                font-size: 1em;
            }
        }

        .mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <button class="btn mode-toggle" onclick="toggleDarkMode()">🌓</button>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎱 BINGO MULTIJUGADOR</h1>
            <div id="connection-status" class="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Conectando...</span>
            </div>
        </div>

        <!-- Panel de Control -->
        <div class="control-panel">
            <!-- Sección de Conexión -->
            <div class="panel-section" id="connection-section">
                <h2>🎮 Unirse al Juego</h2>
                <div class="input-group">
                    <label for="sala-id">ID de la Sala:</label>
                    <input type="text" id="sala-id" placeholder="Ingresa el ID de la sala">
                </div>
                <div class="input-group">
                    <label for="jugador-nombre">Tu Nombre:</label>
                    <input type="text" id="jugador-nombre" placeholder="Ingresa tu nombre">
                </div>
                <button class="btn btn-primary" onclick="unirseASala()">Unirse a la Sala</button>
                <button class="btn btn-warning" onclick="salirDeSala()" style="margin-top: 10px; display: none;" id="btn-salir">Salir de la Sala</button>
            </div>

            <!-- Sección del Juego -->
            <div class="panel-section" id="game-section" style="display: none;">
                <h2>🎯 Juego en Progreso</h2>
                <p>Sala: <strong id="sala-actual"></strong></p>
                <p>Jugadores: <strong id="jugadores-count">0</strong></p>
                <button class="btn btn-success" onclick="cantarBingo()" id="btn-bingo">¡BINGO!</button>
            </div>
        </div>

        <!-- Últimos números cantados -->
        <div class="last-numbers" id="last-numbers"></div>

        <!-- Cartón de Bingo -->
        <div class="bingo-card" id="bingo-card-container" style="display: none;">
            <div class="bingo-header">
                <div class="bingo-header-cell">B</div>
                <div class="bingo-header-cell">I</div>
                <div class="bingo-header-cell">N</div>
                <div class="bingo-header-cell">G</div>
                <div class="bingo-header-cell">O</div>
            </div>
            <div class="bingo-grid" id="bingo-grid"></div>
        </div>

        <!-- Chat -->
        <div class="chat-container" id="chat-container" style="display: none;">
            <h3>💬 Chat de la Sala</h3>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="chat-input" placeholder="Escribe un mensaje...">
                <button class="btn btn-primary" onclick="enviarMensaje()">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación -->
    <div class="modal" id="confirm-modal">
        <div class="modal-content">
            <h2>🎉 ¿Confirmar BINGO?</h2>
            <p>¿Estás seguro de que tienes BINGO?</p>
            <button class="btn btn-success" onclick="confirmarBingo()">Sí, ¡BINGO!</button>
            <button class="btn btn-primary" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <!-- Modal de Ganador -->
    <div class="modal" id="winner-modal">
        <div class="modal-content">
            <h2>🏆 ¡FELICIDADES!</h2>
            <p id="winner-message"></p>
            <button class="btn btn-primary" onclick="cerrarModal()">Cerrar</button>
        </div>
    </div>

    <script>
        // ============ CONFIGURACIÓN DE FIREBASE ============
        const firebaseConfig = {
            apiKey: "AIzaSyDwlYlqRqoKWEAcPn5q8HdQZ0JYPyfZiUM",
            authDomain: "todolist-70474.firebaseapp.com",
            projectId: "todolist-70474",
            storageBucket: "todolist-70474.appspot.com",
            messagingSenderId: "648317201696",
            appId: "1:648317201696:web:9c5a34e3e8a4c7e8c8c8c8"
        };

        // Inicializar Firebase
        let app, db;
        try {
            app = firebase.initializeApp(firebaseConfig);
            db = firebase.firestore(app);
            console.log('Firebase inicializado correctamente');
        } catch (error) {
            console.error('Error inicializando Firebase:', error);
        }

        // ============ VARIABLES GLOBALES ============
        let salaActual = null;
        let jugadorActual = null;
        let cartonActual = null;
        let numerosCantados = new Set();
        let unsubscribeNumeros = null;
        let unsubscribeChat = null;

        // ============ FUNCIONES DE CONEXIÓN ============
        function actualizarEstadoConexion(online) {
            const statusDiv = document.getElementById('connection-status');
            if (online) {
                statusDiv.className = 'connection-status online';
                statusDiv.querySelector('.status-text').textContent = 'Conectado';
            } else {
                statusDiv.className = 'connection-status offline';
                statusDiv.querySelector('.status-text').textContent = 'Desconectado';
            }
        }

        // Monitorear estado de conexión
        window.addEventListener('online', () => actualizarEstadoConexion(true));
        window.addEventListener('offline', () => actualizarEstadoConexion(false));
        actualizarEstadoConexion(navigator.onLine);

        // ============ FUNCIONES DEL JUEGO ============
        async function unirseASala() {
            const salaId = document.getElementById('sala-id').value.trim();
            const nombre = document.getElementById('jugador-nombre').value.trim();

            if (!salaId || !nombre) {
                alert('Por favor completa todos los campos');
                return;
            }

            try {
                // Verificar si la sala existe
                const salaRef = db.collection('salas').doc(salaId);
                const salaDoc = await salaRef.get();

                if (!salaDoc.exists) {
                    // Crear la sala si no existe
                    await salaRef.set({
                        creada: firebase.firestore.FieldValue.serverTimestamp(),
                        estado: 'activa'
                    });
                }

                // Registrar jugador
                const jugadorRef = salaRef.collection('jugadores').doc(nombre);
                await jugadorRef.set({
                    nombre: nombre,
                    unido: firebase.firestore.FieldValue.serverTimestamp(),
                    bingo: false
                });

                salaActual = salaId;
                jugadorActual = nombre;

                // Generar cartón
                cartonActual = generarCarton();
                guardarCartonLocal(cartonActual);
                mostrarCarton(cartonActual);

                // Mostrar secciones del juego
                document.getElementById('game-section').style.display = 'block';
                document.getElementById('bingo-card-container').style.display = 'block';
                document.getElementById('chat-container').style.display = 'block';
                document.getElementById('btn-salir').style.display = 'inline-block';
                document.getElementById('sala-actual').textContent = salaId;

                // Escuchar números cantados
                escucharNumerosCantados(salaId);
                
                // Inicializar chat
                inicializarChat(salaId);
                
                // Escuchar jugadores
                escucharJugadores(salaId);

                actualizarEstadoConexion(true);
                console.log(`Unido a la sala ${salaId} como ${nombre}`);
            } catch (error) {
                console.error('Error al unirse a la sala:', error);
                alert('Error al unirse a la sala: ' + error.message);
            }
        }

        async function salirDeSala() {
            if (!salaActual || !jugadorActual) return;

            try {
                // Eliminar jugador de la sala
                await db.collection('salas').doc(salaActual)
                    .collection('jugadores').doc(jugadorActual).delete();

                // Limpiar listeners
                if (unsubscribeNumeros) unsubscribeNumeros();
                if (unsubscribeChat) unsubscribeChat();

                // Resetear estado
                salaActual = null;
                jugadorActual = null;
                cartonActual = null;
                numerosCantados.clear();

                // Ocultar secciones del juego
                document.getElementById('game-section').style.display = 'none';
                document.getElementById('bingo-card-container').style.display = 'none';
                document.getElementById('chat-container').style.display = 'none';
                document.getElementById('btn-salir').style.display = 'none';
                document.getElementById('last-numbers').innerHTML = '';
                document.getElementById('bingo-grid').innerHTML = '';

                console.log('Sala abandonada');
            } catch (error) {
                console.error('Error al salir de la sala:', error);
            }
        }

        // ============ GENERACIÓN DE CARTÓN ============
        function generarCarton() {
            const rangos = [
                [1, 15],   // B
                [16, 30],  // I
                [31, 45],  // N
                [46, 60],  // G
                [61, 75]   // O
            ];

            const carton = Array(5).fill().map(() => Array(5).fill(0));
            const numerosUsados = new Set();

            for (let col = 0; col < 5; col++) {
                const [min, max] = rangos[col];
                const columnaNumeros = [];

                while (columnaNumeros.length < 5) {
                    const num = Math.floor(Math.random() * (max - min + 1)) + min;
                    if (!numerosUsados.has(num)) {
                        numerosUsados.add(num);
                        columnaNumeros.push(num);
                    }
                }

                columnaNumeros.sort((a, b) => a - b);
                
                for (let row = 0; row < 5; row++) {
                    if (col === 2 && row === 2) {
                        carton[row][col] = 'FREE';
                    } else {
                        carton[row][col] = columnaNumeros[row];
                    }
                }
            }

            return carton;
        }

        function mostrarCarton(carton) {
            const grid = document.getElementById('bingo-grid');
            grid.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 5; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'bingo-cell';
                    
                    if (carton[i][j] === 'FREE') {
                        cell.textContent = 'FREE';
                        cell.classList.add('free', 'marked');
                    } else {
                        cell.textContent = carton[i][j];
                        cell.onclick = () => marcarCelda(cell, carton[i][j]);
                    }
                    
                    cell.dataset.numero = carton[i][j];
                    grid.appendChild(cell);
                }
            }
        }

        function marcarCelda(cell, numero) {
            if (numerosCantados.has(numero)) {
                cell.classList.toggle('marked');
                verificarBingoAutomatico();
            }
        }

        // ============ ESCUCHAR NÚMEROS CANTADOS ============
        function escucharNumerosCantados(salaId) {
            if (unsubscribeNumeros) unsubscribeNumeros();

            unsubscribeNumeros = db.collection('salas').doc(salaId)
                .collection('numeros_cantados')
                .orderBy('timestamp', 'desc')
                .limit(10)
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            const numero = change.doc.data().numero;
                            numerosCantados.add(numero);
                            mostrarNumeroCantado(numero);
                            marcarNumeroEnCarton(numero);
                        }
                    });
                }, (error) => {
                    console.error('Error escuchando números:', error);
                    actualizarEstadoConexion(false);
                });
        }

        function mostrarNumeroCantado(numero) {
            const container = document.getElementById('last-numbers');
            
            // Limitar a 10 números mostrados
            if (container.children.length >= 10) {
                container.removeChild(container.lastChild);
            }

            const ball = document.createElement('div');
            ball.className = 'number-ball';
            ball.textContent = numero;
            container.insertBefore(ball, container.firstChild);

            // Efecto de sonido (simulado con animación)
            ball.style.animation = 'none';
            ball.offsetHeight; // Trigger reflow
            ball.style.animation = 'bounceIn 0.5s';
        }

        function marcarNumeroEnCarton(numero) {
            const celdas = document.querySelectorAll('.bingo-cell');
            celdas.forEach(celda => {
                const cellNum = celda.dataset.numero;
                if (cellNum && parseInt(cellNum) === numero) {
                    celda.classList.add('marked', 'numero-cantado');
                    
                    // Remover animación después de que termine
                    celda.addEventListener('animationend', () => {
                        celda.classList.remove('numero-cantado');
                    }, { once: true });
                }
            });
        }

        // ============ VERIFICACIÓN DE BINGO ============
        function verificarBingoAutomatico() {
            if (!cartonActual) return false;
            
            const celdas = document.querySelectorAll('.bingo-cell');
            const marcadas = new Set();
            
            celdas.forEach(celda => {
                if (celda.classList.contains('marked')) {
                    const num = celda.dataset.numero;
                    if (num && num !== 'FREE') {
                        marcadas.add(parseInt(num));
                    }
                }
            });

            // Verificar filas
            for (let i = 0; i < 5; i++) {
                const fila = cartonActual[i].filter(n => n !== 'FREE');
                if (fila.every(n => marcadas.has(n))) {
                    return true;
                }
            }

            // Verificar columnas
            for (let j = 0; j < 5; j++) {
                const columna = [];
                for (let i = 0; i < 5; i++) {
                    if (cartonActual[i][j] !== 'FREE') {
                        columna.push(cartonActual[i][j]);
                    }
                }
                if (columna.every(n => marcadas.has(n))) {
                    return true;
                }
            }

            // Verificar diagonales
            const diagonal1 = [];
            const diagonal2 = [];
            for (let i = 0; i < 5; i++) {
                if (cartonActual[i][i] !== 'FREE') diagonal1.push(cartonActual[i][i]);
                if (cartonActual[i][4-i] !== 'FREE') diagonal2.push(cartonActual[i][4-i]);
            }
            
            if (diagonal1.every(n => marcadas.has(n)) || 
                diagonal2.every(n => marcadas.has(n))) {
                return true;
            }

            // Cartón lleno
            const todosNumeros = cartonActual.flat().filter(n => n !== 'FREE');
            if (todosNumeros.every(n => marcadas.has(n))) {
                return true;
            }

            return false;
        }

        function cantarBingo() {
            if (!verificarBingoAutomatico()) {
                alert('¡No tienes BINGO! Revisa tu cartón.');
                return;
            }
            
            document.getElementById('confirm-modal').classList.add('active');
        }

        async function confirmarBingo() {
            if (!salaActual || !jugadorActual) return;

            try {
                // Verificar que nadie más haya cantado bingo
                const salaRef = db.collection('salas').doc(salaActual);
                const ganadoresSnapshot = await salaRef.collection('ganadores').get();
                
                if (!ganadoresSnapshot.empty) {
                    alert('¡Alguien más ya cantó BINGO!');
                    cerrarModal();
                    return;
                }

                // Registrar ganador
                await salaRef.collection('ganadores').add({
                    jugador: jugadorActual,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Marcar jugador como ganador
                await salaRef.collection('jugadores').doc(jugadorActual).update({
                    bingo: true
                });

                // Efectos visuales
                document.getElementById('bingo-card-container').classList.add('winner');
                lanzarConfeti();
                mostrarMensajeGanador(`¡${jugadorActual} ha ganado! 🎉`);
                
                cerrarModal();
            } catch (error) {
                console.error('Error al confirmar bingo:', error);
                alert('Error al registrar el bingo');
            }
        }

        // ============ CHAT ============
        function inicializarChat(salaId) {
            if (unsubscribeChat) unsubscribeChat();

            unsubscribeChat = db.collection('salas').doc(salaId)
                .collection('chat')
                .orderBy('timestamp', 'asc')
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            const msg = change.doc.data();
                            mostrarMensajeChat(msg.jugador, msg.texto);
                        }
                    });
                });

            // Enviar mensaje con Enter
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    enviarMensaje();
                }
            });
        }

        async function enviarMensaje() {
            const input = document.getElementById('chat-input');
            const texto = input.value.trim();
            
            if (!texto || !salaActual || !jugadorActual) return;

            try {
                await db.collection('salas').doc(salaActual)
                    .collection('chat').add({
                        jugador: jugadorActual,
                        texto: texto,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                
                input.value = '';
            } catch (error) {
                console.error('Error enviando mensaje:', error);
            }
        }

        function mostrarMensajeChat(jugador, texto) {
            const messagesDiv = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message';
            messageDiv.innerHTML = `<strong>${jugador}:</strong> ${texto}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ============ JUGADORES EN SALA ============
        function escucharJugadores(salaId) {
            db.collection('salas').doc(salaId)
                .collection('jugadores')
                .onSnapshot((snapshot) => {
                    document.getElementById('jugadores-count').textContent = snapshot.size;
                });
        }

        // ============ EFECTOS VISUALES ============
        function lanzarConfeti() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFD700', '#FF8C00', '#FF1493'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 3000);
                }, i * 20);
            }
        }

        function mostrarMensajeGanador(mensaje) {
            document.getElementById('winner-message').textContent = mensaje;
            document.getElementById('winner-modal').classList.add('active');
        }

        function cerrarModal() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.classList.remove('active');
            });
        }

        // ============ MODO OSCURO ============
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
        }

        // Cargar preferencia de modo oscuro
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }

        // ============ AUTO-GUARDADO ============
        function guardarCartonLocal(carton) {
            localStorage.setItem('bingo-carton-actual', JSON.stringify(carton));
        }

        function recuperarCartonLocal() {
            const guardado = localStorage.getItem('bingo-carton-actual');
            if (guardado && salaActual) {
                cartonActual = JSON.parse(guardado);
                mostrarCarton(cartonActual);
            }
        }

        // ============ INICIALIZACIÓN ============
        window.addEventListener('load', () => {
            console.log('Bingo Multijugador cargado');
            actualizarEstadoConexion(navigator.onLine);
        });

        // Manejar cierre de ventana
        window.addEventListener('beforeunload', () => {
            if (salaActual && jugadorActual) {
                salirDeSala();
            }
        });
    </script>
</body>
</html>
