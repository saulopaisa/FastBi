<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Bingo - Jugador</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #FF6B6B; --gold: #ffb703; --success: #10b981; --danger: #ef4444;
            --warning: #f59e0b; --dark: #0b0f1a; --card-bg: #16213e;
            --text-white: #ffffff; --text-gray: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--dark); color: var(--text-white); min-height: 100vh; min-height: 100dvh; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; padding-bottom: 20px; }
        .container { max-width: 900px; margin: 0 auto; padding: 10px; padding-bottom: 30px; }
        .header-fijo { position: sticky; top: 0; z-index: 50; background: var(--dark); padding: 8px 0; border-bottom: 2px solid #2d3436; }
        .header-top { text-align: center; }
        .header-top h1 { font-size: 1.5em; background: linear-gradient(45deg, var(--primary), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .sala-info { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.7em; color: var(--text-gray); flex-wrap: wrap; }
        .connection-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .connection-dot.online { background: var(--success); animation: pulse 2s infinite; }
        .connection-dot.offline { background: var(--danger); }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
        .numeros-bar { display: flex; align-items: center; gap: 8px; padding: 8px 0; flex-wrap: wrap; justify-content: center; }
        .ultima-bola-grande { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--danger), #b91c1c); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5); flex-shrink: 0; cursor: pointer; }
        .ultima-bola-grande:active { transform: scale(0.9); }
        .ultima-bola-grande .letra { font-size: 0.65em; color: rgba(255,255,255,0.8); }
        .ultima-bola-grande .numero { font-size: 1.4em; line-height: 1; }
        .ultimas-bolas-scroll { display: flex; gap: 5px; overflow-x: auto; flex: 1; padding: 4px 0; -webkit-overflow-scrolling: touch; }
        .ultimas-bolas-scroll::-webkit-scrollbar { height: 2px; }
        .ultimas-bolas-scroll::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }
        .bola-chica { width: 34px; height: 34px; min-width: 34px; border-radius: 50%; background: var(--card-bg); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.75em; cursor: pointer; }
        .bola-chica.ultima { background: #fbbf24; color: #1e293b; border-color: #f59e0b; }
        .info-bar { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
        .info-card { background: var(--card-bg); padding: 8px 12px; border-radius: 8px; text-align: center; flex: 1; min-width: 55px; border: 1px solid #2d3436; }
        .info-value { font-size: 1.3em; font-weight: bold; color: var(--gold); }
        .info-label { font-size: 0.6em; color: var(--text-gray); text-transform: uppercase; letter-spacing: 1px; }
        .errores-indicator { text-align: center; font-size: 0.75em; margin: 5px 0; padding: 5px; border-radius: 8px; }
        .errores-indicator.clean { color: var(--success); }
        .errores-indicator.warning { color: var(--warning); background: rgba(245,158,11,0.1); }
        .errores-indicator.eliminado { color: var(--danger); background: rgba(239,68,68,0.1); }
        .vista-selector { display: flex; gap: 6px; margin: 8px 0; }
        .vista-selector button { flex: 1; padding: 8px; border: 2px solid #334155; border-radius: 8px; background: var(--card-bg); color: var(--text-gray); cursor: pointer; font-weight: bold; font-size: 0.8em; }
        .vista-selector button.activo { border-color: var(--gold); color: var(--gold); background: #1e293b; }
        .btn { padding: 12px 20px; border: none; border-radius: 12px; font-weight: bold; font-size: 0.9em; cursor: pointer; transition: all 0.2s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:active { transform: scale(0.97); } .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; }
        .btn-bingo { background: linear-gradient(135deg, #10b981, #059669) !important; color: white; font-size: 1.1em !important; padding: 14px !important; animation: glowBingo 1.5s infinite; box-shadow: 0 4px 20px rgba(16,185,129,0.4); }
        @keyframes glowBingo { 0%,100%{box-shadow:0 4px 20px rgba(16,185,129,0.4);} 50%{box-shadow:0 4px 35px rgba(16,185,129,0.8);} }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #b91c1c); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--warning); color: var(--warning); }
        .btn-ver-numeros { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; font-size: 0.8em; padding: 10px; }
        .game-screen { display: none; }
        .cartones-container { display: flex; flex-direction: column; gap: 12px; margin: 10px 0; }
        .cartones-container.horizontal { flex-direction: row; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 10px; gap: 12px; }
        .cartones-container.horizontal .carton-wrapper { flex: 0 0 auto; width: 320px; min-width: 300px; }
        .carton-wrapper { background: white; border-radius: 12px; padding: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .carton-numero { text-align: center; font-size: 0.65em; color: #64748b; margin-bottom: 3px; font-weight: bold; }
        .carton-header { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-bottom: 2px; }
        .carton-header-cell { background: var(--primary); color: white; padding: 7px 2px; text-align: center; font-weight: 900; font-size: 0.8em; border-radius: 5px; }
        .carton-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
        .carton-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #f1f5f9; border: 2px solid #e2e8f0; border-radius: 5px; font-weight: 700; font-size: 0.8em; color: #1e293b; cursor: pointer; transition: all 0.15s; position: relative; min-width: 0; padding: 2px; }
        .carton-cell:active { transform: scale(0.93); }
        .carton-cell.marked { background: var(--success) !important; color: white !important; border-color: #059669 !important; }
        .carton-cell.marked::after { content: '✓'; position: absolute; top: 1px; right: 2px; font-size: 0.45em; }
        .carton-cell.free { background: #fef3c7 !important; border-color: var(--gold) !important; font-size: 0.6em; cursor: default; }
        .carton-cell.patron-cell { border: 2px dashed var(--warning); background: #fef9e7; }
        .carton-cell.ultima-cantada { animation: popCell 0.4s ease-out; background: #fbbf24 !important; color: #1e293b !important; }
        @keyframes popCell { 0%{transform:scale(0.6);} 60%{transform:scale(1.2);} 100%{transform:scale(1);} }
        .acciones-jugador { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .chat-status { text-align: center; font-size: 0.7em; margin-top: 5px; padding: 5px; border-radius: 8px; }
        .chat-status.bloqueado { color: var(--text-gray); }
        .chat-status.desbloqueado { color: var(--success); background: rgba(16,185,129,0.1); }
        .admin-mensaje { background: linear-gradient(135deg, #1e3a5f, #0f172a); border-left: 4px solid var(--gold); padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; font-size: 0.85em; display: none; }
        .chat-flotante { position: fixed; bottom: 20px; right: 15px; z-index: 200; }
        .btn-chat { width: 50px; height: 50px; border-radius: 50%; background: #6366f1; color: white; border: none; font-size: 1.3em; cursor: pointer; box-shadow: 0 4px 15px rgba(99,102,241,0.5); display: flex; align-items: center; justify-content: center; position: relative; }
        .chat-badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 0.55em; display: none; align-items: center; justify-content: center; }
        .chat-panel { display: none; position: fixed; bottom: 80px; right: 15px; width: 300px; max-height: 400px; background: var(--card-bg); border-radius: 15px; border: 2px solid #6366f1; z-index: 199; overflow: hidden; }
        .chat-panel.activo { display: flex; flex-direction: column; }
        .chat-header { background: #6366f1; padding: 10px; font-weight: bold; font-size: 0.8em; text-align: center; }
        .chat-mensajes { flex: 1; overflow-y: auto; padding: 10px; max-height: 250px; min-height: 100px; background: #0f172a; }
        .msg-item { margin-bottom: 6px; padding: 6px 10px; border-radius: 10px; font-size: 0.7em; max-width: 90%; word-wrap: break-word; }
        .msg-admin { background: #6366f1; color: white; margin-left: auto; text-align: right; }
        .msg-jugador { background: #334155; color: white; }
        .msg-sistema { background: #fef3c7; color: #92400e; text-align: center; margin: 4px auto; font-style: italic; }
        .msg-timestamp { font-size: 0.55em; color: rgba(255,255,255,0.6); margin-top: 2px; }
        .chat-input-area { display: flex; padding: 8px; gap: 5px; background: #0f172a; }
        .chat-input-area input { flex: 1; padding: 8px; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 0.75em; outline: none; }
        .chat-input-area input:disabled { opacity: 0.4; }
        .chat-input-area button { background: #6366f1; color: white; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; }
        .chat-input-area button:disabled { opacity: 0.4; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 16px; text-align: center; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; border: 2px solid var(--gold); }
        .modal-content h2 { color: var(--gold); margin-bottom: 12px; font-size: 1.1em; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; } .modal-buttons .btn { flex: 1; }
        .miniruleta-container { display: flex; flex-direction: column; gap: 10px; }
        .miniruleta-letra { background: var(--primary); color: white; padding: 8px; border-radius: 8px 8px 0 0; font-weight: bold; font-size: 1.1em; text-align: center; }
        .miniruleta-numeros { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 8px; background: #0f172a; border-radius: 0 0 8px 8px; }
        .miniruleta-numero { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 6px 4px; text-align: center; font-weight: bold; font-size: 0.75em; color: #64748b; }
        .miniruleta-numero.cantado { background: var(--success); color: white; border-color: #059669; }
        .confetti-piece { position: fixed; width: 10px; height: 10px; top: -20px; animation: confettiFall 3s linear forwards; z-index: 400; pointer-events: none; }
        @keyframes confettiFall { 0%{transform:translateY(0) rotate(0deg);} 100%{transform:translateY(100vh) rotate(720deg);} }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #333; color: white; padding: 12px 24px; border-radius: 25px; font-size: 0.85em; z-index: 500; opacity: 0; transition: all 0.3s; white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: var(--success); } .toast.error { background: var(--danger); } .toast.warning { background: var(--warning); color: #1e293b; }
        .loading-screen { text-align: center; padding: 40px 20px; background: var(--card-bg); border-radius: 16px; max-width: 400px; margin: 40px auto; }
        .loading-screen .icon { font-size: 4em; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
        .loading-screen h2 { color: var(--gold); margin-top: 15px; }
        @media (max-width: 380px) { .carton-cell { font-size: 0.65em; } .chat-panel { width: 260px; } .miniruleta-numeros { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-fijo">
            <div class="header-top">
                <h1>🎱 BINGO</h1>
                <div class="sala-info">🏠 <strong id="salaNombre">-</strong> | 👤 <strong id="jugadorNombre">-</strong><span class="connection-dot online" id="connectionDot"></span></div>
            </div>
            <div class="numeros-bar">
                <div class="ultima-bola-grande" id="ultimaBolaGrande" onclick="abrirMiniRuleta()"><span class="letra">-</span><span class="numero">--</span></div>
                <div class="ultimas-bolas-scroll" id="ultimasBolasScroll"></div>
            </div>
        </div>
        <div id="loadingScreen" class="loading-screen"><div class="icon">🎫</div><h2>Cargando cartones...</h2></div>
        <div id="gameScreen" class="game-screen">
            <div class="info-bar">
                <div class="info-card"><div class="info-value" id="jugadoresCount">0</div><div class="info-label">Jugadores</div></div>
                <div class="info-card"><div class="info-value" id="cantadosCount">0</div><div class="info-label">Cantados</div></div>
                <div class="info-card"><div class="info-value" id="cronometroDisplay">--</div><div class="info-label">Tiempo</div></div>
            </div>
            <div id="adminMensaje" class="admin-mensaje"></div>
            <div class="errores-indicator clean" id="erroresIndicator">✅ 0/2 errores</div>
            <div class="vista-selector" id="vistaSelector" style="display:none;">
                <button onclick="cambiarVista('vertical')" id="btnVistaVertical" class="activo">📱 VERTICAL</button>
                <button onclick="cambiarVista('horizontal')" id="btnVistaHorizontal">📱↔ HORIZONTAL</button>
            </div>
            <div class="cartones-container vertical" id="cartonesContainer"></div>
            <div class="acciones-jugador">
                <button class="btn btn-bingo" onclick="cantarBingo()">🎉 ¡BINGO!</button>
                <button class="btn btn-ver-numeros" onclick="abrirMiniRuleta()">🔢 VER NÚMEROS</button>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">
                <button class="btn btn-outline" onclick="solicitarDesbloquearChat()">🔒 PEDIR HABLAR</button>
                <button class="btn btn-danger" onclick="salirDelJuego()">🚪 Salir</button>
            </div>
            <div class="chat-status bloqueado" id="chatStatus">🔒 Chat bloqueado</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalMiniRuleta"><div class="modal-content"><h2>🔢 NÚMEROS CANTADOS</h2><div class="miniruleta-container" id="miniruletaContainer"></div><div class="miniruleta-total" id="miniruletaTotal"></div><button class="btn btn-primary" onclick="cerrarModal('modalMiniRuleta')">CERRAR</button></div></div>
    <div class="chat-flotante" id="chatFlotante" style="display:none;">
        <button class="btn-chat" onclick="toggleChat()">💬<span class="chat-badge" id="chatBadge">0</span></button>
        <div class="chat-panel" id="chatPanel">
            <div class="chat-header">💬 CHAT</div>
            <div class="chat-mensajes" id="chatMensajes"><p class="chat-vacio">No hay mensajes</p></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Chat bloqueado..." disabled onkeypress="if(event.key==='Enter')enviarChat()">
                <button onclick="enviarChat()" id="btnEnviarChat" disabled>➤</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalConfirmar"><div class="modal-content"><h2>🎉 ¿Confirmar BINGO?</h2><p>Máximo 2 intentos.</p><div class="modal-buttons"><button class="btn btn-success" onclick="confirmarBingo()">✅ Sí</button><button class="btn btn-danger" onclick="cerrarModal('modalConfirmar')">❌ No</button></div></div></div>
    <div class="modal-overlay" id="modalGanador"><div class="modal-content"><h2>🏆 ¡GANASTE!</h2><p id="ganadorMensaje"></p><button class="btn btn-primary" onclick="cerrarModal('modalGanador')">🎉 Cerrar</button></div></div>
    <div class="modal-overlay" id="modalEliminado"><div class="modal-content"><h2>❌ ELIMINADO</h2><button class="btn btn-danger" onclick="salirDelJuego()">🚪 Salir</button></div></div>
    <div class="modal-overlay" id="modalPartidaTerminada"><div class="modal-content"><h2>🏁 Partida Terminada</h2><p id="partidaTerminadaMensaje"></p><button class="btn btn-primary" onclick="limpiarParaNuevaPartida()">🔄 Nueva Partida</button></div></div>
    <div class="toast" id="toast"></div>

    <script>
        // ============ CONFIGURACIÓN SUPABASE ============
        const SUPABASE_URL = 'https://yoakkyizazpyboxqkuhg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvYWtreWl6YXpweWJveHFrdWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDMyNjUsImV4cCI6MjEwMjM3OTI2NX0.a99WU6PvuwwhBpf-PCodZ-gfiFM-dxEvq245_SB7i3U';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function obtenerParametro(nombre) { const p = new URLSearchParams(window.location.search); return p.get(nombre) || null; }
        const SALA_ID = obtenerParametro('sala');
        let JUGADOR_NOMBRE = obtenerParametro('jugador');

        if (!SALA_ID) { document.getElementById('loadingScreen').innerHTML = '<div class="icon">⚠️</div><h2>Sala no encontrada</h2>'; }
        else { document.getElementById('salaNombre').textContent = SALA_ID; if (JUGADOR_NOMBRE) document.getElementById('jugadorNombre').textContent = JUGADOR_NOMBRE; }

        let miNombre = JUGADOR_NOMBRE, misCartones = [], cantadosSet = new Set(), patronActual = [];
        let juegoConectado = false, vistaActual = 'vertical', chatDesbloqueado = false, erroresBingo = 0, eliminado = false;
        let canalPartida = null, canalChat = null;

        function cambiarVista(tipo) {
            vistaActual = tipo;
            const c = document.getElementById('cartonesContainer');
            c.classList.remove('vertical', 'horizontal'); c.classList.add(tipo);
            document.getElementById('btnVistaVertical').classList.toggle('activo', tipo === 'vertical');
            document.getElementById('btnVistaHorizontal').classList.toggle('activo', tipo === 'horizontal');
            localStorage.setItem('bingo_vista', tipo);
        }

        async function cargarCartones() {
            if (!SALA_ID || !miNombre) return;
            try {
                const { data: cartones, error } = await supabase
                    .from('cartones')
                    .select('*')
                    .eq('sala_id', SALA_ID)
                    .ilike('asignado_a', miNombre);
                
                if (error) throw error;
                if (!cartones || cartones.length === 0) {
                    document.getElementById('loadingScreen').innerHTML = '<div class="icon">⚠️</div><h2>Sin cartones</h2><p style="color:#94a3b8;">No tienes cartones asignados.</p>';
                    return;
                }
                misCartones = cartones.map(c => ({ id: c.id, carton: c.carton, numero: c.numero }));
                miNombre = cartones[0].asignado_a;
                document.getElementById('jugadorNombre').textContent = miNombre;
                juegoConectado = true;
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('gameScreen').style.display = 'block';
                document.getElementById('chatFlotante').style.display = 'block';
                if (misCartones.length === 2) document.getElementById('vistaSelector').style.display = 'flex';
                inicializarJuego();
            } catch (error) {
                document.getElementById('loadingScreen').innerHTML = '<div class="icon">❌</div><h2>Error</h2>';
            }
        }

        function inicializarJuego() {
            mostrarCartones(); escucharPartida(); escucharChat();
            const v = localStorage.getItem('bingo_vista'); if (v) cambiarVista(v);
        }

        function mostrarCartones() {
            const container = document.getElementById('cartonesContainer'); container.innerHTML = '';
            container.classList.add(vistaActual);
            misCartones.forEach((cd, index) => {
                const wrapper = document.createElement('div'); wrapper.className = 'carton-wrapper';
                let html = '<div class="carton-numero">CARTÓN #' + (cd.numero || (index + 1)) + '</div><div class="carton-header">';
                ['B','I','N','G','O'].forEach(l => html += '<div class="carton-header-cell">' + l + '</div>');
                html += '</div><div class="carton-grid">';
                for (let f = 0; f < 5; f++) {
                    ['B','I','N','G','O'].forEach(letra => {
                        const v = cd.carton[letra][f], centro = (letra === 'N' && f === 2), indice = f * 5 + ['B','I','N','G','O'].indexOf(letra);
                        html += '<div class="carton-cell' + (centro ? ' free marked' : '') + '" data-valor="' + v + '" data-indice="' + indice + '" onclick="toggleCelda(this)">' + (centro ? '⭐' : v) + '</div>';
                    });
                }
                html += '</div>';
                wrapper.innerHTML = html; container.appendChild(wrapper);
            });
            if (patronActual.length > 0) aplicarPatronACartones();
            cantadosSet.forEach(num => marcarNumeroEnCartones(num, false));
        }

        function toggleCelda(cell) { cell.classList.toggle('marked'); }

        function aplicarPatronACartones() {
            document.querySelectorAll('.carton-cell').forEach(cell => {
                const i = parseInt(cell.dataset.indice);
                if (patronActual[i] && !cell.classList.contains('free')) cell.classList.add('patron-cell');
                else cell.classList.remove('patron-cell');
            });
        }

        function marcarNumeroEnCartones(numero, animar = true) {
            document.querySelectorAll('.carton-cell').forEach(cell => {
                if (parseInt(cell.dataset.valor) === numero) {
                    cell.classList.add('marked');
                    if (animar) { cell.classList.add('ultima-cantada'); setTimeout(() => cell.classList.remove('ultima-cantada'), 600); }
                }
            });
        }

        function escucharPartida() {
            // Cargar estado inicial
            supabase.from('partidas').select('*').eq('sala_id', SALA_ID).single().then(({ data }) => {
                if (data) {
                    if (data.cantados && Array.isArray(data.cantados)) {
                        data.cantados.forEach(num => { cantadosSet.add(num); marcarNumeroEnCartones(num, false); });
                        document.getElementById('cantadosCount').textContent = data.cantados.length;
                        if (data.cantados.length > 0) actualizarUltimaBolaGrande(data.cantados[data.cantados.length - 1]);
                        actualizarUltimasBolasScroll(data.cantados);
                    }
                    if (data.patron && Array.isArray(data.patron)) { patronActual = data.patron; aplicarPatronACartones(); }
                    if (data.jugadores_activos && Array.isArray(data.jugadores_activos)) document.getElementById('jugadoresCount').textContent = data.jugadores_activos.length;
                }
            });

            // Escuchar cambios en tiempo real
            canalPartida = supabase
                .channel('partida-' + SALA_ID)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'partidas', filter: 'sala_id=eq.' + SALA_ID }, (payload) => {
                    const data = payload.new || payload.old;
                    if (data && data.cantados && Array.isArray(data.cantados)) {
                        data.cantados.forEach(num => { if (!cantadosSet.has(num)) { cantadosSet.add(num); marcarNumeroEnCartones(num, true); } });
                        document.getElementById('cantadosCount').textContent = data.cantados.length;
                        if (data.cantados.length > 0) actualizarUltimaBolaGrande(data.cantados[data.cantados.length - 1]);
                        actualizarUltimasBolasScroll(data.cantados);
                    }
                    if (data && data.patron && Array.isArray(data.patron)) { patronActual = data.patron; aplicarPatronACartones(); }
                    if (data && data.jugadores_activos) document.getElementById('jugadoresCount').textContent = data.jugadores_activos.length;
                    if (data && data.resultado_revision && data.resultado_revision.jugador === miNombre) {
                        if (data.resultado_revision.resultado === 'valido') {
                            lanzarConfeti();
                            document.getElementById('ganadorMensaje').textContent = '¡Felicidades ' + miNombre + '!';
                            document.getElementById('modalGanador').classList.add('active');
                            erroresBingo = 0; eliminado = false;
                        } else if (data.resultado_revision.resultado === 'errado') {
                            erroresBingo++;
                            if (erroresBingo >= 2) { eliminado = true; document.getElementById('modalEliminado').classList.add('active'); }
                            else { mostrarToast('❌ BINGO ERRADO. 1 oportunidad restante.', 'error'); }
                        }
                    }
                })
                .subscribe();
        }

        function actualizarUltimaBolaGrande(numero) {
            const b = document.getElementById('ultimaBolaGrande');
            b.querySelector('.letra').textContent = obtenerLetra(numero);
            b.querySelector('.numero').textContent = numero;
            b.style.animation = 'none'; b.offsetHeight;
        }

        function actualizarUltimasBolasScroll(cantados) {
            const c = document.getElementById('ultimasBolasScroll'); c.innerHTML = '';
            cantados.slice(-6).reverse().forEach((num, i) => {
                const bola = document.createElement('div'); bola.className = 'bola-chica' + (i===0?' ultima':'');
                bola.textContent = num; bola.onclick = () => abrirMiniRuleta(); c.appendChild(bola);
            });
        }

        function escucharChat() {
            supabase.from('chat').select('*').eq('sala_id', SALA_ID).order('id', { ascending: false }).limit(30).then(({ data }) => {
                const contenedor = document.getElementById('chatMensajes');
                if (data && data.length > 0) {
                    contenedor.innerHTML = '';
                    data.reverse().forEach(msg => {
                        const div = document.createElement('div');
                        div.className = 'msg-item ' + (msg.sistema ? 'msg-sistema' : (msg.admin ? 'msg-admin' : 'msg-jugador'));
                        div.textContent = msg.mensaje;
                        contenedor.appendChild(div);
                    });
                    contenedor.scrollTop = contenedor.scrollHeight;
                }
            });

            canalChat = supabase
                .channel('chat-' + SALA_ID)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat', filter: 'sala_id=eq.' + SALA_ID }, (payload) => {
                    const msg = payload.new;
                    const contenedor = document.getElementById('chatMensajes');
                    const div = document.createElement('div');
                    div.className = 'msg-item ' + (msg.sistema ? 'msg-sistema' : (msg.admin ? 'msg-admin' : 'msg-jugador'));
                    div.textContent = msg.mensaje;
                    contenedor.appendChild(div);
                    contenedor.scrollTop = contenedor.scrollHeight;
                    if (msg.admin && !msg.sistema) {
                        const md = document.getElementById('adminMensaje');
                        md.textContent = '📢 ' + msg.mensaje; md.style.display = 'block';
                        setTimeout(() => md.style.display = 'none', 8000);
                    }
                })
                .subscribe();
        }

        function solicitarDesbloquearChat() {
            const m = prompt('📝 ¿Qué quieres comunicar al administrador?');
            if (!m) return;
            supabase.from('solicitudes_chat').insert({ sala_id: SALA_ID, jugador: miNombre, mensaje: m, timestamp: Date.now() }).then(() => {
                mostrarToast('📩 Solicitud enviada', 'warning');
            });
        }

        function toggleChat() { const p = document.getElementById('chatPanel'); p.classList.toggle('activo'); if (p.classList.contains('activo') && chatDesbloqueado) document.getElementById('chatInput').focus(); }

        function enviarChat() {
            if (!chatDesbloqueado) { mostrarToast('🔒 Chat bloqueado', 'warning'); return; }
            const m = document.getElementById('chatInput').value.trim(); if (!m) return;
            supabase.from('chat').insert({ sala_id: SALA_ID, mensaje: miNombre + ': ' + m, admin: false, jugador: miNombre, timestamp: Date.now() }).then(() => {
                document.getElementById('chatInput').value = '';
            });
        }

        function cantarBingo() { if (eliminado) { mostrarToast('❌ Eliminado', 'error'); return; } document.getElementById('modalConfirmar').classList.add('active'); }

        async function confirmarBingo() {
            cerrarModal('modalConfirmar');
            try {
                for (const cd of misCartones) {
                    await supabase.from('bingos').insert({ sala_id: SALA_ID, carton_id: String(cd.id), jugador: miNombre, timestamp: Date.now() });
                }
                mostrarToast('🎉 BINGO cantado', 'success');
            } catch (e) { mostrarToast('Error', 'error'); }
        }

        function abrirMiniRuleta() {
            const container = document.getElementById('miniruletaContainer'), total = document.getElementById('miniruletaTotal');
            const letras = ['B','I','N','G','O'], rangos = {'B':[1,15],'I':[16,30],'N':[31,45],'G':[46,60],'O':[61,75]};
            const colores = {'B':'#ef4444','I':'#f59e0b','N':'#10b981','G':'#3b82f6','O':'#8b5cf6'};
            let html = '', tc = 0;
            letras.forEach(l => {
                const [min, max] = rangos[l];
                html += '<div class="miniruleta-seccion"><div class="miniruleta-letra" style="background:' + colores[l] + ';">' + l + ' (' + min + '-' + max + ')</div><div class="miniruleta-numeros">';
                let cl = 0;
                for (let i = min; i <= max; i++) { const ca = cantadosSet.has(i); if (ca) cl++; html += '<div class="miniruleta-numero' + (ca ? ' cantado' : '') + '">' + i + '</div>'; }
                html += '</div><div style="font-size:0.7em;color:#94a3b8;text-align:right;">' + cl + '/' + (max - min + 1) + '</div></div>';
                tc += cl;
            });
            container.innerHTML = html; total.textContent = 'Total: ' + tc + '/75';
            document.getElementById('modalMiniRuleta').classList.add('active');
        }

        function obtenerLetra(n) { if (n <= 15) return 'B'; if (n <= 30) return 'I'; if (n <= 45) return 'N'; if (n <= 60) return 'G'; return 'O'; }
        function cerrarModal(id) { document.getElementById(id).classList.remove('active'); }

        function salirDelJuego() {
            if (canalPartida) supabase.removeChannel(canalPartida);
            if (canalChat) supabase.removeChannel(canalChat);
            juegoConectado = false; misCartones = []; cantadosSet.clear();
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('loadingScreen').style.display = 'block';
            document.getElementById('loadingScreen').innerHTML = '<div class="icon">👋</div><h2>¡Hasta luego!</h2>';
            document.getElementById('chatFlotante').style.display = 'none';
        }

        function lanzarConfeti() {
            const colores = ['#FF6B6B','#4ECDC4','#FFD700','#FF8C00','#FF1493','#10b981'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const c = document.createElement('div'); c.className = 'confetti-piece';
                    c.style.left = Math.random()*100+'%';
                    c.style.backgroundColor = colores[Math.floor(Math.random()*colores.length)];
                    c.style.width = Math.random()*10+5+'px'; c.style.height = Math.random()*10+5+'px';
                    c.style.animationDuration = Math.random()*2+2+'s';
                    document.body.appendChild(c); setTimeout(() => c.remove(), 3000);
                }, i*15);
            }
        }

        function mostrarToast(m, t) {
            const toast = document.getElementById('toast'); toast.textContent = m;
            toast.className = 'toast ' + (t||'');
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (SALA_ID && JUGADOR_NOMBRE) { miNombre = JUGADOR_NOMBRE; cargarCartones(); }
            else if (SALA_ID) {
                const ng = localStorage.getItem('bingo_jugador_nombre');
                if (ng) { miNombre = ng; cargarCartones(); }
                else { document.getElementById('loadingScreen').innerHTML = '<div class="icon">⚠️</div><h2>Link inválido</h2>'; }
            }
        });
    </script>
</body>
</html>
