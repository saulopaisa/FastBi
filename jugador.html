<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Bingo - Jugador</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #FF6B6B;
            --gold: #ffb703;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0b0f1a;
            --card-bg: #16213e;
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --nav-height: 60px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: var(--text-white);
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            padding-bottom: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 10px;
            padding-bottom: 30px;
        }

        /* ========== HEADER FIJO ========== */
        .header-fijo {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--dark);
            padding: 8px 0;
            border-bottom: 2px solid #2d3436;
        }

        .header-top {
            text-align: center;
        }

        .header-top h1 {
            font-size: 1.5em;
            background: linear-gradient(45deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sala-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.7em;
            color: var(--text-gray);
            flex-wrap: wrap;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .connection-dot.online { background: var(--success); animation: pulse 2s infinite; }
        .connection-dot.offline { background: var(--danger); }

        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

        /* Barra de números cantados (sticky) */
        .numeros-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ultima-bola-grande {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--danger), #b91c1c);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5);
            flex-shrink: 0;
        }

        .ultima-bola-grande .letra {
            font-size: 0.65em;
            color: rgba(255,255,255,0.8);
        }

        .ultima-bola-grande .numero {
            font-size: 1.4em;
            line-height: 1;
        }

        .ultimas-bolas-scroll {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            flex: 1;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
        }

        .ultimas-bolas-scroll::-webkit-scrollbar { height: 2px; }
        .ultimas-bolas-scroll::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

        .bola-chica {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.75em;
            animation: popIn 0.3s ease-out;
        }

        .bola-chica.ultima {
            background: #fbbf24;
            color: #1e293b;
            border-color: #f59e0b;
            animation: popIn 0.4s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Info bar */
        .info-bar {
            display: flex;
            gap: 6px;
            margin: 8px 0;
            flex-wrap: wrap;
        }

        .info-card {
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
            min-width: 55px;
            border: 1px solid #2d3436;
        }

        .info-value {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--gold);
        }

        .info-label {
            font-size: 0.6em;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Selector de vista */
        .vista-selector {
            display: flex;
            gap: 6px;
            margin: 8px 0;
        }

        .vista-selector button {
            flex: 1;
            padding: 8px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-gray);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
            transition: all 0.2s;
        }

        .vista-selector button.activo {
            border-color: var(--gold);
            color: var(--gold);
            background: #1e293b;
        }

        /* ========== LOGIN ========== */
        .login-screen {
            text-align: center;
            padding: 30px 20px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid #2d3436;
            max-width: 400px;
            margin: 40px auto;
        }

        .login-screen .icon {
            font-size: 4em;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,100%{transform:translateY(0);}
            50%{transform:translateY(-12px);}
        }

        .login-screen h2 {
            color: var(--gold);
            margin-bottom: 8px;
            font-size: 1.3em;
        }

        .login-screen p {
            color: var(--text-gray);
            margin-bottom: 20px;
            font-size: 0.85em;
        }

        .input-nombre {
            width: 100%;
            padding: 14px;
            border: 2px solid #334155;
            border-radius: 12px;
            background: #1e293b;
            color: white;
            font-size: 1.1em;
            text-align: center;
            margin-bottom: 12px;
            transition: border-color 0.3s;
        }

        .input-nombre:focus {
            outline: none;
            border-color: var(--gold);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }

        .btn-bingo {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            color: white;
            font-size: 1.1em !important;
            padding: 14px !important;
            animation: glowBingo 1.5s infinite;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
        }

        @keyframes glowBingo {
            0%,100%{box-shadow:0 4px 20px rgba(16,185,129,0.4);}
            50%{box-shadow:0 4px 35px rgba(16,185,129,0.8);}
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning), #d97706);
            color: #1e293b;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #b91c1c);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--warning);
            color: var(--warning);
        }

        .error-msg {
            background: var(--danger);
            color: white;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.85em;
        }

        /* ========== GAME SCREEN ========== */
        .game-screen { display: none; }

        /* Cartones */
        .cartones-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 10px 0;
        }

        .cartones-container.horizontal {
            flex-direction: row;
            flex-wrap: wrap;
        }

        .cartones-container.horizontal .carton-wrapper {
            flex: 1;
            min-width: 280px;
        }

        .carton-wrapper {
            background: white;
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .carton-numero {
            text-align: center;
            font-size: 0.65em;
            color: #64748b;
            margin-bottom: 3px;
            font-weight: bold;
        }

        .carton-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            margin-bottom: 2px;
        }

        .carton-header-cell {
            background: var(--primary);
            color: white;
            padding: 7px 2px;
            text-align: center;
            font-weight: 900;
            font-size: 0.8em;
            border-radius: 5px;
        }

        .carton-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
        }

        .carton-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 5px;
            font-weight: 700;
            font-size: 0.8em;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            min-width: 0;
            padding: 2px;
        }

        .carton-cell:active { transform: scale(0.93); }

        .carton-cell.marked {
            background: var(--success) !important;
            color: white !important;
            border-color: #059669 !important;
        }

        .carton-cell.marked::after {
            content: '✓';
            position: absolute;
            top: 1px;
            right: 2px;
            font-size: 0.45em;
        }

        .carton-cell.free {
            background: #fef3c7 !important;
            border-color: var(--gold) !important;
            font-size: 0.6em;
            cursor: default;
        }

        .carton-cell.patron-cell {
            border: 2px dashed var(--warning);
            background: #fef9e7;
        }

        .carton-cell.ultima-cantada {
            animation: popCell 0.4s ease-out;
            background: #fbbf24 !important;
            color: #1e293b !important;
            border-color: #f59e0b !important;
        }

        @keyframes popCell {
            0%{transform:scale(0.6);}
            60%{transform:scale(1.2);}
            100%{transform:scale(1);}
        }

        /* Acciones */
        .acciones-jugador {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .acciones-jugador .btn {
            font-size: 0.8em;
            padding: 10px;
        }

        /* ========== CHAT FLOTANTE (COMO LA RULETA) ========== */
        .chat-flotante {
            position: fixed;
            bottom: 20px;
            right: 15px;
            z-index: 200;
        }

        .btn-chat {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #6366f1;
            color: white;
            border: none;
            font-size: 1.3em;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99,102,241,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-chat:active { transform: scale(0.9); }

        .chat-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.55em;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .chat-panel {
            display: none;
            position: fixed;
            bottom: 80px;
            right: 15px;
            width: 280px;
            max-height: 350px;
            background: var(--card-bg);
            border-radius: 15px;
            border: 2px solid #6366f1;
            z-index: 199;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .chat-panel.activo {
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: #6366f1;
            padding: 10px;
            font-weight: bold;
            font-size: 0.8em;
            text-align: center;
        }

        .chat-mensajes {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            max-height: 250px;
            min-height: 100px;
            background: #0f172a;
        }

        .chat-mensajes::-webkit-scrollbar { width: 3px; }
        .chat-mensajes::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 2px; }

        .chat-vacio {
            color: #64748b;
            font-size: 0.7em;
            text-align: center;
        }

        .msg-item {
            margin-bottom: 6px;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.7em;
            max-width: 90%;
            word-wrap: break-word;
        }

        .msg-admin {
            background: #6366f1;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .msg-jugador {
            background: #334155;
            color: white;
        }

        .msg-timestamp {
            font-size: 0.55em;
            color: rgba(255,255,255,0.6);
            margin-top: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 8px;
            gap: 5px;
            background: #0f172a;
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px;
            border-radius: 20px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 0.75em;
            outline: none;
        }

        .chat-input-area button {
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========== MODALES ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 300;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            width: 100%;
            max-width: 350px;
            border: 2px solid var(--gold);
        }

        .modal-content h2 {
            color: var(--gold);
            margin-bottom: 12px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-buttons .btn { flex: 1; }

        .alerta-partida-terminada h2 {
            color: var(--gold);
            margin-bottom: 10px;
        }

        /* Confeti */
        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -20px;
            animation: confettiFall 3s linear forwards;
            z-index: 400;
            pointer-events: none;
        }

        @keyframes confettiFall {
            0%{transform:translateY(0) rotate(0deg); opacity:1;}
            100%{transform:translateY(100vh) rotate(720deg); opacity:0;}
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.85em;
            z-index: 500;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: var(--warning); color: #1e293b; }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 380px) {
            .carton-cell { font-size: 0.65em; border-radius: 3px; }
            .carton-header-cell { font-size: 0.7em; padding: 5px 1px; }
            .ultima-bola-grande { width: 50px; height: 50px; }
            .ultima-bola-grande .numero { font-size: 1.2em; }
            .chat-panel { width: 250px; }
        }

        @media (min-width: 768px) {
            .cartones-container.horizontal .carton-wrapper {
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ========== HEADER FIJO (SIEMPRE VISIBLE) ========== -->
        <div class="header-fijo" id="headerFijo">
            <div class="header-top">
                <h1>🎱 BINGO</h1>
                <div class="sala-info">
                    🏠 <strong id="salaNombre">-</strong>
                    <span class="connection-dot online" id="connectionDot"></span>
                    <span id="connectionText">Conectado</span>
                </div>
            </div>
            <!-- Barra de números (sticky) -->
            <div class="numeros-bar" id="numerosBar">
                <div class="ultima-bola-grande" id="ultimaBolaGrande">
                    <span class="letra">-</span>
                    <span class="numero">--</span>
                </div>
                <div class="ultimas-bolas-scroll" id="ultimasBolasScroll"></div>
            </div>
        </div>

        <!-- Login -->
        <div id="loginScreen" class="login-screen">
            <div class="icon">🎮</div>
            <h2>¡Bienvenido!</h2>
            <p>Ingresa tu nombre para unirte</p>
            <input type="text" id="nombreInput" class="input-nombre" placeholder="Tu nombre" maxlength="20" autocomplete="off">
            <button class="btn btn-primary" onclick="unirseAlJuego()">🎯 UNIRME</button>
            <div id="loginError"></div>
        </div>

        <!-- Juego -->
        <div id="gameScreen" class="game-screen">
            <!-- Info -->
            <div class="info-bar">
                <div class="info-card">
                    <div class="info-value" id="jugadoresCount">0</div>
                    <div class="info-label">Jugadores</div>
                </div>
                <div class="info-card">
                    <div class="info-value" id="cantadosCount">0</div>
                    <div class="info-label">Cantados</div>
                </div>
                <div class="info-card">
                    <div class="info-value" id="cronometroDisplay">--</div>
                    <div class="info-label">Tiempo</div>
                </div>
            </div>

            <!-- Selector de vista -->
            <div class="vista-selector" id="vistaSelector" style="display:none;">
                <button onclick="cambiarVista('vertical')" id="btnVistaVertical" class="activo">📱 VERTICAL</button>
                <button onclick="cambiarVista('horizontal')" id="btnVistaHorizontal">💻 HORIZONTAL</button>
            </div>

            <!-- Cartones -->
            <div class="cartones-container vertical" id="cartonesContainer"></div>

            <!-- Acciones -->
            <div class="acciones-jugador">
                <button class="btn btn-bingo" onclick="cantarBingo()">🎉 ¡BINGO!</button>
                <button class="btn btn-outline" onclick="notificarAdmin()">⚠️ AVISAR ADMIN</button>
            </div>

            <button class="btn btn-danger" onclick="salirDelJuego()" style="margin-top:8px;">🚪 Salir</button>
        </div>
    </div>

    <!-- ========== CHAT FLOTANTE ========== -->
    <div class="chat-flotante" id="chatFlotante" style="display:none;">
        <button class="btn-chat" onclick="toggleChat()">
            💬
            <span class="chat-badge" id="chatBadge">0</span>
        </button>
        <div class="chat-panel" id="chatPanel">
            <div class="chat-header">💬 CHAT</div>
            <div class="chat-mensajes" id="chatMensajes">
                <p class="chat-vacio">No hay mensajes</p>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Escribe..." onkeypress="if(event.key==='Enter')enviarChat()">
                <button onclick="enviarChat()">➤</button>
            </div>
        </div>
    </div>

    <!-- Modal Confirmar -->
    <div class="modal-overlay" id="modalConfirmar">
        <div class="modal-content">
            <h2>🎉 ¿Confirmar BINGO?</h2>
            <p>¿Estás seguro de que completaste el patrón?</p>
            <div class="modal-buttons">
                <button class="btn btn-success" onclick="confirmarBingo()">✅ Sí</button>
                <button class="btn btn-danger" onclick="cerrarModal('modalConfirmar')">❌ No</button>
            </div>
        </div>
    </div>

    <!-- Modal Ganador -->
    <div class="modal-overlay" id="modalGanador">
        <div class="modal-content">
            <h2>🏆 ¡GANASTE!</h2>
            <p id="ganadorMensaje"></p>
            <button class="btn btn-primary" onclick="cerrarModal('modalGanador')">🎉 Cerrar</button>
        </div>
    </div>

    <!-- Modal Partida Terminada -->
    <div class="modal-overlay" id="modalPartidaTerminada">
        <div class="modal-content alerta-partida-terminada">
            <h2>🏁 Partida Terminada</h2>
            <p id="partidaTerminadaMensaje">El administrador ha reiniciado la partida.</p>
            <button class="btn btn-primary" onclick="limpiarParaNuevaPartida()">🔄 Nueva Partida</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============ FIREBASE ============
        const firebaseConfig = {
            apiKey: "AIzaSyAOHYo0w41dV6TRarAaGt58Zxn4o47dNUE",
            authDomain: "bingofast.firebaseapp.com",
            databaseURL: "https://bingofast-default-rtdb.firebaseio.com",
            projectId: "bingofast",
            storageBucket: "bingofast.firebasestorage.app",
            messagingSenderId: "473863283329",
            appId: "1:473863283329:web:2c4bf96de167d105fa6380"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        console.log('🔥 Firebase conectado');

        // ============ OBTENER SALA ============
        function obtenerSalaDeURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('sala') || null;
        }

        const SALA_ID = obtenerSalaDeURL();

        if (SALA_ID) {
            document.getElementById('salaNombre').textContent = SALA_ID;
        } else {
            document.getElementById('salaNombre').textContent = 'No asignada';
            document.getElementById('loginScreen').innerHTML = `
                <div class="icon">⚠️</div>
                <h2>Sala no encontrada</h2>
                <p style="color:#94a3b8;">Solicita un enlace válido al administrador.</p>
                <div class="error-msg">URL debe incluir ?sala=ID_SALA</div>
            `;
        }

        // ============ VARIABLES ============
        let miNombre = null;
        let misCartones = [];
        let cantadosSet = new Set();
        let patronActual = [];
        let juegoConectado = false;
        let ultimoEstadoPartida = null;
        let vistaActual = 'vertical';
        let mensajesChat = [];

        // ============ CONEXIÓN ============
        function actualizarEstadoConexion(online) {
            const dot = document.getElementById('connectionDot');
            const text = document.getElementById('connectionText');
            dot.className = 'connection-dot ' + (online ? 'online' : 'offline');
            text.textContent = online ? 'Conectado' : 'Desconectado';
        }

        db.ref('.info/connected').on('value', (snap) => {
            actualizarEstadoConexion(snap.val() === true);
        });

        // ============ VISTA ============
        function cambiarVista(tipo) {
            vistaActual = tipo;
            const container = document.getElementById('cartonesContainer');
            container.classList.remove('vertical', 'horizontal');
            container.classList.add(tipo);
            
            document.getElementById('btnVistaVertical').classList.toggle('activo', tipo === 'vertical');
            document.getElementById('btnVistaHorizontal').classList.toggle('activo', tipo === 'horizontal');
            
            localStorage.setItem('bingo_vista', tipo);
        }

        // ============ UNIRSE ============
        async function unirseAlJuego() {
            const nombre = document.getElementById('nombreInput').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (!nombre) {
                errorDiv.innerHTML = '<div class="error-msg">Ingresa tu nombre</div>';
                return;
            }

            if (!SALA_ID) {
                errorDiv.innerHTML = '<div class="error-msg">No hay sala asignada</div>';
                return;
            }

            try {
                const cartonesSnapshot = await db.ref('salas/' + SALA_ID + '/cartones').once('value');
                const cartones = cartonesSnapshot.val() || {};

                let cartonesAsignados = [];
                
                // Buscar ya asignados
                Object.entries(cartones).forEach(([id, carton]) => {
                    if (carton.asignadoA === nombre) {
                        cartonesAsignados.push({ id, carton: carton.carton, numero: carton.numero });
                    }
                });

                // Si no tiene, buscar libres (máx 2)
                if (cartonesAsignados.length === 0) {
                    Object.entries(cartones).forEach(([id, carton]) => {
                        if (!carton.asignadoA && cartonesAsignados.length < 2) {
                            cartonesAsignados.push({ id, carton: carton.carton, numero: carton.numero });
                        }
                    });

                    if (cartonesAsignados.length === 0) {
                        errorDiv.innerHTML = '<div class="error-msg">No hay cartones disponibles.</div>';
                        return;
                    }

                    for (const c of cartonesAsignados) {
                        await db.ref('salas/' + SALA_ID + '/cartones/' + c.id).update({
                            asignadoA: nombre,
                            estado: 'asignado'
                        });
                    }
                }

                miNombre = nombre;
                misCartones = cartonesAsignados;
                juegoConectado = true;

                localStorage.setItem('bingo_jugador_nombre', nombre);
                localStorage.setItem('bingo_jugador_sala', SALA_ID);
                localStorage.setItem('bingo_jugador_cartones', JSON.stringify(cartonesAsignados.map(c => c.id)));

                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('gameScreen').style.display = 'block';
                
                // Mostrar chat y selector de vista
                document.getElementById('chatFlotante').style.display = 'block';
                if (misCartones.length === 2) {
                    document.getElementById('vistaSelector').style.display = 'flex';
                }

                inicializarJuego();
                mostrarToast('✅ Conectado con ' + cartonesAsignados.length + ' cartón(es)', 'success');

            } catch (error) {
                console.error('Error:', error);
                errorDiv.innerHTML = '<div class="error-msg">Error al conectar</div>';
            }
        }

        function inicializarJuego() {
            mostrarCartones();
            escucharPartida();
            escucharChat();
            
            // Restaurar vista
            const vistaGuardada = localStorage.getItem('bingo_vista');
            if (vistaGuardada) cambiarVista(vistaGuardada);
        }

        // ============ MOSTRAR CARTONES ============
        function mostrarCartones() {
            const container = document.getElementById('cartonesContainer');
            container.innerHTML = '';
            container.classList.add(vistaActual);

            misCartones.forEach((cartonData, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'carton-wrapper';
                wrapper.id = 'carton-' + index;
                
                let html = '<div class="carton-numero">CARTÓN #' + (cartonData.numero || (index + 1)) + '</div>';
                html += '<div class="carton-header">';
                ['B','I','N','G','O'].forEach(l => {
                    html += '<div class="carton-header-cell">' + l + '</div>';
                });
                html += '</div><div class="carton-grid">';

                for (let fila = 0; fila < 5; fila++) {
                    ['B','I','N','G','O'].forEach(letra => {
                        const valor = cartonData.carton[letra][fila];
                        const esCentro = (letra === 'N' && fila === 2);
                        const indice = fila * 5 + ['B','I','N','G','O'].indexOf(letra);
                        
                        html += '<div class="carton-cell' + 
                            (esCentro ? ' free marked' : '') + 
                            '" data-carton="' + index + 
                            '" data-valor="' + valor + 
                            '" data-indice="' + indice + 
                            '" onclick="toggleCelda(this)">' + 
                            (esCentro ? '⭐' : valor) + 
                            '</div>';
                    });
                }
                html += '</div>';
                
                wrapper.innerHTML = html;
                container.appendChild(wrapper);
            });

            if (patronActual.length > 0) aplicarPatronACartones();
            cantadosSet.forEach(num => marcarNumeroEnCartones(num, false));
        }

        function toggleCelda(cell) {
            const valor = parseInt(cell.dataset.valor);
            if (isNaN(valor)) return;
            
            if (cantadosSet.has(valor)) {
                cell.classList.toggle('marked');
            }
        }

        function aplicarPatronACartones() {
            document.querySelectorAll('.carton-cell').forEach(cell => {
                const indice = parseInt(cell.dataset.indice);
                if (patronActual[indice] && !cell.classList.contains('free')) {
                    cell.classList.add('patron-cell');
                } else {
                    cell.classList.remove('patron-cell');
                }
            });
        }

        function marcarNumeroEnCartones(numero, animar = true) {
            document.querySelectorAll('.carton-cell').forEach(cell => {
                if (parseInt(cell.dataset.valor) === numero) {
                    cell.classList.add('marked');
                    if (animar) {
                        cell.classList.add('ultima-cantada');
                        setTimeout(() => cell.classList.remove('ultima-cantada'), 600);
                    }
                }
            });
        }

        // ============ ESCUCHAR PARTIDA ============
        function escucharPartida() {
            const partidaRef = db.ref('partidas/' + SALA_ID);

            partidaRef.on('value', (snap) => {
                const data = snap.val();
                if (!data) return;

                // Detectar reinicio
                if (data.estado === 'nueva_partida' || data.estado === 'terminado') {
                    if (ultimoEstadoPartida && ultimoEstadoPartida !== 'nueva_partida' && ultimoEstadoPartida !== 'terminado') {
                        mostrarPartidaTerminada(data);
                    }
                }

                if (!data.cantados || data.cantados.length === 0) {
                    if (cantadosSet.size > 0) {
                        mostrarPartidaTerminada(data);
                    }
                }

                ultimoEstadoPartida = data.estado;

                // Números cantados
                if (data.cantados && Array.isArray(data.cantados)) {
                    data.cantados.forEach(num => {
                        if (!cantadosSet.has(num)) {
                            cantadosSet.add(num);
                            marcarNumeroEnCartones(num, true);
                        }
                    });
                    document.getElementById('cantadosCount').textContent = data.cantados.length;
                    
                    if (data.cantados.length > 0) {
                        actualizarUltimaBolaGrande(data.cantados[data.cantados.length - 1]);
                    }
                    actualizarUltimasBolasScroll(data.cantados);
                }

                // Patrón
                if (data.patron && Array.isArray(data.patron)) {
                    patronActual = data.patron;
                    aplicarPatronACartones();
                }

                // Jugadores
                if (data.jugadoresActivos && Array.isArray(data.jugadoresActivos)) {
                    document.getElementById('jugadoresCount').textContent = data.jugadoresActivos.length;
                }

                // Cronómetro
                if (data.cronometro && data.cronometro > 0) {
                    const mins = Math.floor(data.cronometro / 60);
                    const segs = data.cronometro % 60;
                    document.getElementById('cronometroDisplay').textContent = 
                        String(mins).padStart(2, '0') + ':' + String(segs).padStart(2, '0');
                } else if (data.estado === 'jugando') {
                    document.getElementById('cronometroDisplay').textContent = '▶️';
                } else if (data.estado === 'pausa') {
                    document.getElementById('cronometroDisplay').textContent = '⏸️';
                }

                // Resultado revisión
                if (data.resultadoRevision && data.resultadoRevision.jugador === miNombre) {
                    if (data.resultadoRevision.resultado === 'valido') {
                        lanzarConfeti();
                        document.getElementById('ganadorMensaje').textContent = 
                            '¡Felicidades ' + miNombre + '! Tu BINGO fue validado 🎉';
                        document.getElementById('modalGanador').classList.add('active');
                    } else if (data.resultadoRevision.resultado === 'errado') {
                        mostrarToast('❌ BINGO ERRADO. Revisa tu cartón.', 'error');
                    }
                }
            });
        }

        function actualizarUltimaBolaGrande(numero) {
            const bola = document.getElementById('ultimaBolaGrande');
            bola.querySelector('.letra').textContent = obtenerLetra(numero);
            bola.querySelector('.numero').textContent = numero;
            bola.style.animation = 'none';
            bola.offsetHeight;
            bola.style.animation = 'bolaGrande 0.5s ease-out';
        }

        function actualizarUltimasBolasScroll(cantados) {
            const container = document.getElementById('ultimasBolasScroll');
            const ultimos = cantados.slice(-6).reverse();
            
            container.innerHTML = '';
            ultimos.forEach((num, i) => {
                const bola = document.createElement('div');
                bola.className = 'bola-chica' + (i === 0 ? ' ultima' : '');
                bola.textContent = num;
                container.appendChild(bola);
            });
        }

        function mostrarPartidaTerminada(data) {
            const mensaje = data.mensajeAdmin || 'El administrador ha reiniciado la partida.';
            document.getElementById('partidaTerminadaMensaje').textContent = mensaje;
            document.getElementById('modalPartidaTerminada').classList.add('active');
        }

        function limpiarParaNuevaPartida() {
            cantadosSet.clear();
            patronActual = [];
            
            document.getElementById('cantadosCount').textContent = '0';
            document.getElementById('cronometroDisplay').textContent = '--';
            document.getElementById('ultimaBolaGrande').querySelector('.letra').textContent = '-';
            document.getElementById('ultimaBolaGrande').querySelector('.numero').textContent = '--';
            document.getElementById('ultimasBolasScroll').innerHTML = '';
            
            document.querySelectorAll('.carton-cell').forEach(cell => {
                cell.classList.remove('marked', 'ultima-cantada', 'patron-cell');
            });
            document.querySelectorAll('.carton-cell.free').forEach(cell => {
                cell.classList.add('marked');
            });
            
            document.getElementById('modalPartidaTerminada').classList.remove('active');
            mostrarToast('🔄 Listo para nueva partida', 'success');
        }

        // ============ CHAT ============
        function escucharChat() {
            db.ref('partidas/' + SALA_ID + '/chat').limitToLast(50).on('value', (snap) => {
                const contenedor = document.getElementById('chatMensajes');
                if (!contenedor) return;
                
                if (!snap.exists()) {
                    contenedor.innerHTML = '<p class="chat-vacio">No hay mensajes</p>';
                    return;
                }
                
                contenedor.innerHTML = '';
                const mensajes = [];
                snap.forEach(child => mensajes.push(child.val()));
                mensajes.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                
                mensajes.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'msg-item ' + (msg.admin ? 'msg-admin' : 'msg-jugador');
                    div.innerHTML = (msg.admin ? '📢 ' : '') + msg.mensaje + 
                        '<div class="msg-timestamp">' + new Date(msg.timestamp).toLocaleTimeString() + '</div>';
                    contenedor.appendChild(div);
                });
                
                contenedor.scrollTop = contenedor.scrollHeight;
                
                // Badge si el chat está cerrado
                const panel = document.getElementById('chatPanel');
                if (!panel.classList.contains('activo') && mensajes.length > mensajesChat.length) {
                    const nuevos = mensajes.length - mensajesChat.length;
                    const badge = document.getElementById('chatBadge');
                    badge.style.display = 'flex';
                    badge.textContent = nuevos > 99 ? '99+' : nuevos;
                }
                
                mensajesChat = mensajes;
            });
        }

        function toggleChat() {
            const panel = document.getElementById('chatPanel');
            panel.classList.toggle('activo');
            if (panel.classList.contains('activo')) {
                document.getElementById('chatBadge').style.display = 'none';
                document.getElementById('chatInput').focus();
            }
        }

        function enviarChat() {
            const input = document.getElementById('chatInput');
            const mensaje = input.value.trim();
            if (!mensaje || !miNombre) return;
            
            db.ref('partidas/' + SALA_ID + '/chat').push({
                mensaje: miNombre + ': ' + mensaje,
                timestamp: Date.now(),
                admin: false
            });
            input.value = '';
        }

        // ============ BINGO ============
        function verificarBingoLocal() {
            if (misCartones.length === 0 || patronActual.length === 0) return false;
            const letras = ['B', 'I', 'N', 'G', 'O'];
            
            for (let c = 0; c < misCartones.length; c++) {
                const carton = misCartones[c].carton;
                let bingo = true;
                
                for (let i = 0; i < 25; i++) {
                    if (!patronActual[i]) continue;
                    if (i === 12) continue;
                    
                    const fila = Math.floor(i / 5);
                    const col = i % 5;
                    const valor = carton[letras[col]][fila];
                    
                    if (!cantadosSet.has(valor)) {
                        bingo = false;
                        break;
                    }
                }
                
                if (bingo) return true;
            }
            return false;
        }

        function cantarBingo() {
            if (!verificarBingoLocal()) {
                mostrarToast('❌ Aún no completas el patrón', 'error');
                return;
            }
            document.getElementById('modalConfirmar').classList.add('active');
        }

        async function confirmarBingo() {
            cerrarModal('modalConfirmar');
            try {
                for (const cartonData of misCartones) {
                    await db.ref('bingos/' + SALA_ID).push({
                        cartonId: cartonData.id,
                        jugador: miNombre,
                        timestamp: Date.now()
                    });
                }
                mostrarToast('🎉 BINGO cantado. Esperando validación...', 'success');
            } catch (error) {
                console.error('Error:', error);
                mostrarToast('Error al cantar bingo', 'error');
            }
        }

        // ============ NOTIFICAR ADMIN ============
        function notificarAdmin() {
            if (!miNombre) return;
            db.ref('partidas/' + SALA_ID).update({
                alertaJugador: {
                    jugador: miNombre,
                    mensaje: '⚠️ ' + miNombre + ' solicita atención',
                    timestamp: Date.now()
                }
            });
            mostrarToast('⚠️ Aviso enviado al administrador', 'warning');
        }

        // ============ UTILIDADES ============
        function obtenerLetra(n) {
            if (n <= 15) return 'B';
            if (n <= 30) return 'I';
            if (n <= 45) return 'N';
            if (n <= 60) return 'G';
            return 'O';
        }

        function cerrarModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        async function salirDelJuego() {
            if (!juegoConectado || !confirm('¿Salir del juego?')) return;
            for (const c of misCartones) {
                await db.ref('salas/' + SALA_ID + '/cartones/' + c.id).update({
                    asignadoA: null,
                    estado: 'disponible'
                });
            }
            juegoConectado = false;
            miNombre = null;
            misCartones = [];
            cantadosSet.clear();
            mensajesChat = [];
            localStorage.clear();
            
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('nombreInput').value = '';
            document.getElementById('cartonesContainer').innerHTML = '';
            document.getElementById('ultimasBolasScroll').innerHTML = '';
            document.getElementById('chatFlotante').style.display = 'none';
            document.getElementById('vistaSelector').style.display = 'none';
            document.getElementById('chatMensajes').innerHTML = '<p class="chat-vacio">No hay mensajes</p>';
        }

        // ============ EFECTOS ============
        function lanzarConfeti() {
            const colores = ['#FF6B6B', '#4ECDC4', '#FFD700', '#FF8C00', '#FF1493', '#10b981'];
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti-piece';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
                    confetti.style.width = Math.random() * 12 + 6 + 'px';
                    confetti.style.height = Math.random() * 12 + 6 + 'px';
                    confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 3500);
                }, i * 12);
            }
        }

        function mostrarToast(mensaje, tipo) {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast ' + (tipo || '');
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ============ INICIALIZACIÓN ============
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🎱 Bingo Jugador - Sala:', SALA_ID);
            
            const nombreGuardado = localStorage.getItem('bingo_jugador_nombre');
            const salaGuardada = localStorage.getItem('bingo_jugador_sala');
            const cartonesIds = JSON.parse(localStorage.getItem('bingo_jugador_cartones') || '[]');
            
            if (nombreGuardado && salaGuardada === SALA_ID && cartonesIds.length > 0) {
                document.getElementById('nombreInput').value = nombreGuardado;
                
                Promise.all(cartonesIds.map(id => 
                    db.ref('salas/' + SALA_ID + '/cartones/' + id).once('value')
                )).then(snapshots => {
                    misCartones = [];
                    snapshots.forEach((snap, i) => {
                        const data = snap.val();
                        if (data && data.asignadoA === nombreGuardado) {
                            misCartones.push({ id: cartonesIds[i], carton: data.carton, numero: data.numero });
                        }
                    });
                    
                    if (misCartones.length > 0) {
                        miNombre = nombreGuardado;
                        juegoConectado = true;
                        
                        document.getElementById('loginScreen').style.display = 'none';
                        document.getElementById('gameScreen').style.display = 'block';
                        document.getElementById('chatFlotante').style.display = 'block';
                        if (misCartones.length === 2) {
                            document.getElementById('vistaSelector').style.display = 'flex';
                        }
                        
                        inicializarJuego();
                        
                        db.ref('partidas/' + SALA_ID).once('value', (snap) => {
                            const data = snap.val();
                            if (data && data.cantados) {
                                data.cantados.forEach(num => {
                                    cantadosSet.add(num);
                                    marcarNumeroEnCartones(num, false);
                                });
                                document.getElementById('cantadosCount').textContent = data.cantados.length;
                                if (data.cantados.length > 0) {
                                    actualizarUltimaBolaGrande(data.cantados[data.cantados.length - 1]);
                                }
                                actualizarUltimasBolasScroll(data.cantados);
                            }
                            if (data && data.patron) {
                                patronActual = data.patron;
                                aplicarPatronACartones();
                            }
                        });
                        
                        mostrarToast('✅ Reconectado', 'success');
                    }
                });
            }

            document.getElementById('nombreInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') unirseAlJuego();
            });
        });

        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this && this.id !== 'modalPartidaTerminada') {
                    this.classList.remove('active');
                }
            });
        });

        window.addEventListener('beforeunload', () => {
            if (juegoConectado && misCartones.length > 0) {
                misCartones.forEach(c => {
                    db.ref('salas/' + SALA_ID + '/cartones/' + c.id).update({
                        asignadoA: null,
                        estado: 'disponible'
                    });
                });
            }
        });
    </script>
</body>
</html>
