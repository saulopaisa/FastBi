<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Multijugador - FastBi</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --dark: #2C3E50;
            --light: #ECF0F1;
            --success: #2ECC71;
            --warning: #F39C12;
            --danger: #E74C3C;
            --bingo-gold: #FFD700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        body.dark-mode .container {
            background: rgba(30, 30, 50, 0.95);
            color: #fff;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .sala-info {
            background: var(--secondary);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            font-size: 1.1em;
            margin-top: 10px;
        }

        /* Estado de conexión */
        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin: 10px 0;
        }

        .connection-status.online {
            background: #d4edda;
            color: #155724;
        }

        .connection-status.offline {
            background: #f8d7da;
            color: #721c24;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .online .status-dot {
            background: #28a745;
            animation: pulse 2s infinite;
        }

        .offline .status-dot {
            background: #dc3545;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Pantalla de inicio */
        .join-screen {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 500px;
            margin: 50px auto;
        }

        body.dark-mode .join-screen {
            background: #2d2d44;
        }

        .join-screen h2 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 2em;
        }

        .join-screen .welcome-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 1.2em;
            text-align: center;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255,107,107,0.2);
        }

        /* Panel de control */
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        body.dark-mode .panel-section {
            background: #2d2d44;
        }

        .panel-section h2 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        /* Botones */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-large {
            padding: 15px 40px;
            font-size: 1.3em;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Cartón de Bingo */
        .bingo-card {
            background: white;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 500px;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        .bingo-card.winner {
            animation: winGlow 1s infinite;
            box-shadow: 0 0 30px gold;
        }

        @keyframes winGlow {
            0%, 100% { box-shadow: 0 0 10px gold; }
            50% { box-shadow: 0 0 30px gold, 0 0 60px gold; }
        }

        .bingo-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 5px;
        }

        .bingo-header-cell {
            background: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.5em;
            border-radius: 10px;
        }

        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .bingo-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        body.dark-mode .bingo-cell {
            background: #3d3d5c;
            border-color: #555;
        }

        .bingo-cell:hover {
            background: #e3f2fd;
            transform: scale(1.05);
        }

        .bingo-cell.marked {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .bingo-cell.marked::after {
            content: '✓';
            position: absolute;
            font-size: 0.7em;
            top: 5px;
            right: 5px;
        }

        .bingo-cell.free {
            background: var(--bingo-gold);
            color: var(--dark);
            font-weight: bold;
        }

        .bingo-cell.numero-cantado {
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Últimos números */
        .last-numbers {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .number-ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
            animation: bounceIn 0.5s;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Chat */
        .chat-container {
            margin-top: 20px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        body.dark-mode .chat-container {
            background: #2d2d44;
        }

        .chat-messages {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .chat-message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            animation: modalIn 0.3s;
        }

        @keyframes modalIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Confeti */
        .confetti {
            position: fixed;
            top: -10px;
            animation: confettiFall 3s linear;
        }

        @keyframes confettiFall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        /* Información del juego */
        .game-info {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0;
        }

        .info-card {
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        body.dark-mode .info-card {
            background: #2d2d44;
        }

        .info-card .info-value {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary);
        }

        .info-card .info-label {
            font-size: 0.9em;
            color: #666;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .control-panel {
                grid-template-columns: 1fr;
            }
            
            .bingo-cell {
                font-size: 1em;
            }
            
            .game-info {
                flex-direction: column;
            }
        }

        .mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5em;
        }

        .error-message {
            background: var(--danger);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <button class="btn mode-toggle" onclick="toggleDarkMode()">🌓</button>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎱 BINGO MULTIJUGADOR</h1>
            <div id="connection-status" class="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Conectando...</span>
            </div>
        </div>

        <!-- Pantalla de Unirse (solo nombre) -->
        <div id="join-screen" class="join-screen">
            <div class="welcome-icon">🎮</div>
            <h2>¡Bienvenido al Bingo!</h2>
            <p style="margin-bottom: 20px; color: #666;">Sala asignada: <strong id="sala-asignada">Cargando...</strong></p>
            <div class="input-group">
                <input type="text" id="jugador-nombre" placeholder="Ingresa tu nombre para jugar" maxlength="20">
            </div>
            <button class="btn btn-primary btn-large" onclick="unirseAJuego()">
                🎯 ¡Unirme al Juego!
            </button>
            <div id="join-error" style="margin-top: 15px;"></div>
        </div>

        <!-- Pantalla de Juego (inicialmente oculta) -->
        <div id="game-screen" style="display: none;">
            <!-- Información del juego -->
            <div class="sala-info" style="text-align: center; margin-bottom: 20px;">
                🏠 Sala: <strong id="sala-actual"></strong> | 
                👤 Jugador: <strong id="jugador-actual"></strong>
            </div>

            <!-- Panel de Control -->
            <div class="control-panel">
                <div class="panel-section">
                    <h2>📊 Estado del Juego</h2>
                    <div class="game-info">
                        <div class="info-card">
                            <div class="info-value" id="jugadores-count">0</div>
                            <div class="info-label">Jugadores</div>
                        </div>
                        <div class="info-card">
                            <div class="info-value" id="numeros-count">0</div>
                            <div class="info-label">Números Cantados</div>
                        </div>
                        <div class="info-card">
                            <div class="info-value" id="tu-carton-label">1</div>
                            <div class="info-label">Tu Cartón</div>
                        </div>
                    </div>
                    <button class="btn btn-success" onclick="cantarBingo()" id="btn-bingo" style="width: 100%; margin-top: 15px;">
                        🎉 ¡BINGO!
                    </button>
                </div>
            </div>

            <!-- Últimos números cantados -->
            <div style="text-align: center; margin: 20px 0;">
                <h3 style="color: var(--primary);">Últimos Números</h3>
                <div class="last-numbers" id="last-numbers"></div>
            </div>

            <!-- Cartón de Bingo -->
            <div class="bingo-card" id="bingo-card-container">
                <div class="bingo-header">
                    <div class="bingo-header-cell">B</div>
                    <div class="bingo-header-cell">I</div>
                    <div class="bingo-header-cell">N</div>
                    <div class="bingo-header-cell">G</div>
                    <div class="bingo-header-cell">O</div>
                </div>
                <div class="bingo-grid" id="bingo-grid"></div>
            </div>

            <!-- Chat -->
            <div class="chat-container" id="chat-container">
                <h3>💬 Chat de la Sala</h3>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input">
                    <input type="text" id="chat-input" placeholder="Escribe un mensaje...">
                    <button class="btn btn-primary" onclick="enviarMensaje()">Enviar</button>
                </div>
            </div>

            <!-- Botón para salir -->
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn btn-danger" onclick="salirDeJuego()">🚪 Salir del Juego</button>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación -->
    <div class="modal" id="confirm-modal">
        <div class="modal-content">
            <h2>🎉 ¿Confirmar BINGO?</h2>
            <p>¿Estás seguro de que tienes BINGO?</p>
            <button class="btn btn-success" onclick="confirmarBingo()">Sí, ¡BINGO!</button>
            <button class="btn btn-primary" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <!-- Modal de Ganador -->
    <div class="modal" id="winner-modal">
        <div class="modal-content">
            <h2>🏆 ¡FELICIDADES!</h2>
            <p id="winner-message"></p>
            <button class="btn btn-primary" onclick="cerrarModal()">Cerrar</button>
        </div>
    </div>

    <script>
        // ============ CONFIGURACIÓN DE FIREBASE ============
        const firebaseConfig = {
            apiKey: "AIzaSyDwlYlqRqoKWEAcPn5q8HdQZ0JYPyfZiUM",
            authDomain: "todolist-70474.firebaseapp.com",
            projectId: "todolist-70474",
            storageBucket: "todolist-70474.appspot.com",
            messagingSenderId: "648317201696",
            appId: "1:648317201696:web:9c5a34e3e8a4c7e8c8c8c8"
        };

        // Inicializar Firebase
        let app, db;
        try {
            app = firebase.initializeApp(firebaseConfig);
            db = firebase.firestore(app);
            console.log('Firebase inicializado correctamente');
        } catch (error) {
            console.error('Error inicializando Firebase:', error);
            mostrarError('Error de conexión con el servidor');
        }

        // ============ OBTENER SALA DE LA URL ============
        function obtenerSalaDeURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const sala = urlParams.get('sala');
            return sala;
        }

        const salaAsignada = obtenerSalaDeURL();

        // Mostrar sala asignada o error si no hay
        if (salaAsignada) {
            document.getElementById('sala-asignada').textContent = salaAsignada;
        } else {
            document.getElementById('sala-asignada').textContent = 'No asignada';
            document.getElementById('join-screen').innerHTML = `
                <div class="welcome-icon">⚠️</div>
                <h2>Sala no encontrada</h2>
                <p style="color: #666; margin: 20px 0;">
                    No se ha especificado una sala de juego.<br>
                    Por favor, solicita un enlace válido al administrador.
                </p>
                <div class="error-message">
                    La URL debe incluir el parámetro ?sala=ID_SALA
                </div>
            `;
        }

        // ============ VARIABLES GLOBALES ============
        let jugadorActual = null;
        let cartonActual = null;
        let numerosCantados = new Set();
        let unsubscribeNumeros = null;
        let unsubscribeChat = null;
        let juegoIniciado = false;

        // ============ FUNCIONES DE CONEXIÓN ============
        function actualizarEstadoConexion(online) {
            const statusDiv = document.getElementById('connection-status');
            if (online) {
                statusDiv.className = 'connection-status online';
                statusDiv.querySelector('.status-text').textContent = 'Conectado';
            } else {
                statusDiv.className = 'connection-status offline';
                statusDiv.querySelector('.status-text').textContent = 'Desconectado';
            }
        }

        // Monitorear estado de conexión
        window.addEventListener('online', () => actualizarEstadoConexion(true));
        window.addEventListener('offline', () => actualizarEstadoConexion(false));
        actualizarEstadoConexion(navigator.onLine);

        // ============ FUNCIÓN PRINCIPAL: UNIRSE AL JUEGO ============
        async function unirseAJuego() {
            const nombre = document.getElementById('jugador-nombre').value.trim();
            const errorDiv = document.getElementById('join-error');

            if (!nombre) {
                errorDiv.innerHTML = '<div class="error-message">Por favor ingresa tu nombre</div>';
                return;
            }

            if (!salaAsignada) {
                errorDiv.innerHTML = '<div class="error-message">No hay una sala asignada. Recarga la página con un enlace válido.</div>';
                return;
            }

            try {
                // Verificar si la sala existe
                const salaRef = db.collection('salas').doc(salaAsignada);
                const salaDoc = await salaRef.get();

                if (!salaDoc.exists) {
                    errorDiv.innerHTML = '<div class="error-message">La sala no existe o ya no está disponible</div>';
                    return;
                }

                // Verificar que el nombre no esté en uso
                const jugadorExistente = await salaRef.collection('jugadores').doc(nombre).get();
                if (jugadorExistente.exists) {
                    errorDiv.innerHTML = '<div class="error-message">Ese nombre ya está en uso. Elige otro.</div>';
                    return;
                }

                // Registrar jugador en la sala
                await salaRef.collection('jugadores').doc(nombre).set({
                    nombre: nombre,
                    unido: firebase.firestore.FieldValue.serverTimestamp(),
                    bingo: false
                });

                jugadorActual = nombre;
                console.log(`✅ Jugador ${nombre} unido a la sala ${salaAsignada}`);

                // Generar cartón único para este jugador
                cartonActual = generarCarton();
                
                // Guardar cartón en Firestore
                await salaRef.collection('jugadores').doc(nombre).update({
                    carton: cartonActual
                });

                // Iniciar la interfaz del juego
                iniciarJuego();

            } catch (error) {
                console.error('Error al unirse al juego:', error);
                errorDiv.innerHTML = `<div class="error-message">Error: ${error.message}</div>`;
            }
        }

        function iniciarJuego() {
            // Ocultar pantalla de join
            document.getElementById('join-screen').style.display = 'none';
            
            // Mostrar pantalla de juego
            document.getElementById('game-screen').style.display = 'block';
            
            // Actualizar información
            document.getElementById('sala-actual').textContent = salaAsignada;
            document.getElementById('jugador-actual').textContent = jugadorActual;
            
            // Mostrar cartón
            mostrarCarton(cartonActual);
            
            // Configurar listeners
            escucharNumerosCantados(salaAsignada);
            inicializarChat(salaAsignada);
            escucharJugadores(salaAsignada);
            escucharEstadoJuego(salaAsignada);
            
            // Guardar cartón localmente como respaldo
            localStorage.setItem(`bingo-carton-${salaAsignada}`, JSON.stringify(cartonActual));
            
            juegoIniciado = true;
            actualizarEstadoConexion(true);
        }

        // ============ GENERACIÓN DE CARTÓN ============
        function generarCarton() {
            const rangos = [
                [1, 15],   // B
                [16, 30],  // I
                [31, 45],  // N
                [46, 60],  // G
                [61, 75]   // O
            ];

            const carton = Array(5).fill().map(() => Array(5).fill(0));
            const numerosUsados = new Set();

            for (let col = 0; col < 5; col++) {
                const [min, max] = rangos[col];
                const columnaNumeros = [];

                while (columnaNumeros.length < 5) {
                    const num = Math.floor(Math.random() * (max - min + 1)) + min;
                    if (!numerosUsados.has(num)) {
                        numerosUsados.add(num);
                        columnaNumeros.push(num);
                    }
                }

                columnaNumeros.sort((a, b) => a - b);
                
                for (let row = 0; row < 5; row++) {
                    if (col === 2 && row === 2) {
                        carton[row][col] = 'FREE';
                    } else {
                        carton[row][col] = columnaNumeros[row];
                    }
                }
            }

            return carton;
        }

        function mostrarCarton(carton) {
            const grid = document.getElementById('bingo-grid');
            grid.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 5; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'bingo-cell';
                    
                    if (carton[i][j] === 'FREE') {
                        cell.textContent = 'FREE';
                        cell.classList.add('free', 'marked');
                    } else {
                        cell.textContent = carton[i][j];
                        cell.onclick = () => marcarCelda(cell, carton[i][j]);
                    }
                    
                    cell.dataset.numero = carton[i][j];
                    cell.dataset.fila = i;
                    cell.dataset.columna = j;
                    grid.appendChild(cell);
                }
            }
        }

        function marcarCelda(cell, numero) {
            if (numerosCantados.has(numero)) {
                cell.classList.toggle('marked');
                verificarBingoAutomatico();
            }
        }

        // ============ ESCUCHAR NÚMEROS CANTADOS ============
        function escucharNumerosCantados(salaId) {
            if (unsubscribeNumeros) unsubscribeNumeros();

            unsubscribeNumeros = db.collection('salas').doc(salaId)
                .collection('numeros_cantados')
                .orderBy('timestamp', 'desc')
                .limit(75) // Máximo 75 números en total
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            const numero = change.doc.data().numero;
                            if (!numerosCantados.has(numero)) {
                                numerosCantados.add(numero);
                                mostrarNumeroCantado(numero);
                                marcarNumeroEnCarton(numero);
                                
                                // Actualizar contador
                                document.getElementById('numeros-count').textContent = numerosCantados.size;
                            }
                        }
                    });
                }, (error) => {
                    console.error('Error escuchando números:', error);
                    actualizarEstadoConexion(false);
                });
        }

        function mostrarNumeroCantado(numero) {
            const container = document.getElementById('last-numbers');
            
            // Limitar a 10 números mostrados
            if (container.children.length >= 10) {
                container.removeChild(container.lastChild);
            }

            const ball = document.createElement('div');
            ball.className = 'number-ball';
            ball.textContent = numero;
            container.insertBefore(ball, container.firstChild);
        }

        function marcarNumeroEnCarton(numero) {
            const celdas = document.querySelectorAll('.bingo-cell');
            celdas.forEach(celda => {
                const cellNum = celda.dataset.numero;
                if (cellNum && parseInt(cellNum) === numero) {
                    celda.classList.add('marked', 'numero-cantado');
                    
                    celda.addEventListener('animationend', () => {
                        celda.classList.remove('numero-cantado');
                    }, { once: true });
                }
            });
        }

        // ============ VERIFICACIÓN DE BINGO ============
        function verificarBingoAutomatico() {
            if (!cartonActual) return false;
            
            const celdas = document.querySelectorAll('.bingo-cell');
            const marcadas = new Set();
            
            celdas.forEach(celda => {
                if (celda.classList.contains('marked')) {
                    const num = celda.dataset.numero;
                    if (num && num !== 'FREE') {
                        marcadas.add(parseInt(num));
                    }
                }
            });

            // Verificar filas
            for (let i = 0; i < 5; i++) {
                const fila = cartonActual[i].filter(n => n !== 'FREE');
                if (fila.length > 0 && fila.every(n => marcadas.has(n))) {
                    return true;
                }
            }

            // Verificar columnas
            for (let j = 0; j < 5; j++) {
                const columna = [];
                for (let i = 0; i < 5; i++) {
                    if (cartonActual[i][j] !== 'FREE') {
                        columna.push(cartonActual[i][j]);
                    }
                }
                if (columna.length > 0 && columna.every(n => marcadas.has(n))) {
                    return true;
                }
            }

            // Verificar diagonales
            const diagonal1 = [];
            const diagonal2 = [];
            for (let i = 0; i < 5; i++) {
                if (cartonActual[i][i] !== 'FREE') diagonal1.push(cartonActual[i][i]);
                if (cartonActual[i][4-i] !== 'FREE') diagonal2.push(cartonActual[i][4-i]);
            }
            
            if ((diagonal1.length > 0 && diagonal1.every(n => marcadas.has(n))) || 
                (diagonal2.length > 0 && diagonal2.every(n => marcadas.has(n)))) {
                return true;
            }

            // Cartón lleno
            const todosNumeros = cartonActual.flat().filter(n => n !== 'FREE');
            if (todosNumeros.length > 0 && todosNumeros.every(n => marcadas.has(n))) {
                return true;
            }

            return false;
        }

        function cantarBingo() {
            if (!verificarBingoAutomatico()) {
                alert('¡No tienes BINGO! Revisa tu cartón.');
                return;
            }
            
            document.getElementById('confirm-modal').classList.add('active');
        }

        async function confirmarBingo() {
            if (!salaAsignada || !jugadorActual) return;

            try {
                // Verificar que nadie más haya cantado bingo
                const salaRef = db.collection('salas').doc(salaAsignada);
                const ganadoresSnapshot = await salaRef.collection('ganadores').get();
                
                if (!ganadoresSnapshot.empty) {
                    alert('¡Alguien más ya cantó BINGO!');
                    cerrarModal();
                    return;
                }

                // Registrar ganador
                await salaRef.collection('ganadores').add({
                    jugador: jugadorActual,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    carton: cartonActual
                });

                // Marcar jugador como ganador
                await salaRef.collection('jugadores').doc(jugadorActual).update({
                    bingo: true
                });

                // Efectos visuales
                document.getElementById('bingo-card-container').classList.add('winner');
                lanzarConfeti();
                mostrarMensajeGanador(`¡${jugadorActual} ha ganado! 🎉`);
                
                cerrarModal();
            } catch (error) {
                console.error('Error al confirmar bingo:', error);
                alert('Error al registrar el bingo');
            }
        }

        // ============ CHAT ============
        function inicializarChat(salaId) {
            if (unsubscribeChat) unsubscribeChat();

            unsubscribeChat = db.collection('salas').doc(salaId)
                .collection('chat')
                .orderBy('timestamp', 'asc')
                .limit(50) // Últimos 50 mensajes
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            const msg = change.doc.data();
                            mostrarMensajeChat(msg.jugador, msg.texto);
                        }
                    });
                });

            // Enviar mensaje con Enter
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    enviarMensaje();
                }
            });
        }

        async function enviarMensaje() {
            const input = document.getElementById('chat-input');
            const texto = input.value.trim();
            
            if (!texto || !salaAsignada || !jugadorActual) return;

            try {
                await db.collection('salas').doc(salaAsignada)
                    .collection('chat').add({
                        jugador: jugadorActual,
                        texto: texto,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                
                input.value = '';
            } catch (error) {
                console.error('Error enviando mensaje:', error);
            }
        }

        function mostrarMensajeChat(jugador, texto) {
            const messagesDiv = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message';
            messageDiv.innerHTML = `<strong>${jugador}:</strong> ${texto}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ============ JUGADORES EN SALA ============
        function escucharJugadores(salaId) {
            db.collection('salas').doc(salaId)
                .collection('jugadores')
                .onSnapshot((snapshot) => {
                    document.getElementById('jugadores-count').textContent = snapshot.size;
                });
        }

        function escucharEstadoJuego(salaId) {
            db.collection('salas').doc(salaId)
                .onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (data.estado === 'finalizado') {
                            alert('El juego ha terminado');
                            salirDeJuego();
                        }
                    }
                });
        }

        // ============ EFECTOS VISUALES ============
        function lanzarConfeti() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFD700', '#FF8C00', '#FF1493'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 3000);
                }, i * 20);
            }
        }

        function mostrarMensajeGanador(mensaje) {
            document.getElementById('winner-message').textContent = mensaje;
            document.getElementById('winner-modal').classList.add('active');
        }

        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('join-error');
            if (errorDiv) {
                errorDiv.innerHTML = `<div class="error-message">${mensaje}</div>`;
            }
        }

        function cerrarModal() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.classList.remove('active');
            });
        }

        // ============ SALIR DEL JUEGO ============
        async function salirDeJuego() {
            if (!salaAsignada || !jugadorActual) return;

            try {
                // Eliminar jugador de la sala
                await db.collection('salas').doc(salaAsignada)
                    .collection('jugadores').doc(jugadorActual).delete();

                // Limpiar listeners
                if (unsubscribeNumeros) unsubscribeNumeros();
                if (unsubscribeChat) unsubscribeChat();

                // Resetear estado
                jugadorActual = null;
                cartonActual = null;
                numerosCantados.clear();
                juegoIniciado = false;

                // Volver a la pantalla de inicio
                document.getElementById('game-screen').style.display = 'none';
                document.getElementById('join-screen').style.display = 'block';
                document.getElementById('jugador-nombre').value = '';
                document.getElementById('join-error').innerHTML = '';
                document.getElementById('last-numbers').innerHTML = '';
                document.getElementById('bingo-grid').innerHTML = '';

            } catch (error) {
                console.error('Error al salir del juego:', error);
            }
        }

        // ============ MODO OSCURO ============
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
        }

        // Cargar preferencia de modo oscuro
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }

        // ============ INICIALIZACIÓN ============
        window.addEventListener('load', () => {
            console.log('🎱 Bingo Multijugador cargado');
            console.log(`Sala asignada: ${salaAsignada || 'No especificada'}`);
            actualizarEstadoConexion(navigator.onLine);
            
            // Si hay sala, enfocar el input de nombre
            if (salaAsignada) {
                document.getElementById('jugador-nombre').focus();
            }
        });

        // Permitir unirse con Enter
        document.getElementById('jugador-nombre').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                unirseAJuego();
            }
        });

        // Manejar cierre de ventana
        window.addEventListener('beforeunload', () => {
            if (juegoIniciado && salaAsignada && jugadorActual) {
                // Intentar eliminar al jugador (fire and forget)
                db.collection('salas').doc(salaAsignada)
                    .collection('jugadores').doc(jugadorActual).delete();
            }
        });
    </script>
</body>
</html>
