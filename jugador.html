<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bingo - Jugador</title>
    
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --gold: #ffb703;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #1a1a2e;
            --bg: #0b0f1a;
            --card-bg: #16213e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: white;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sala-badge {
            display: inline-block;
            background: var(--card-bg);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            margin: 10px 0;
            border: 1px solid var(--gold);
        }

        .sala-badge span {
            color: var(--gold);
            font-weight: bold;
        }

        /* Estado de conexión */
        .connection-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .connection-dot.online { background: var(--success); animation: pulse 2s infinite; }
        .connection-dot.offline { background: var(--danger); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Pantalla de login */
        .login-screen {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid #2d3436;
        }

        .login-screen .icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .login-screen h2 {
            color: var(--gold);
            margin-bottom: 10px;
        }

        .login-screen p {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 0.9em;
        }

        .input-nombre {
            width: 100%;
            padding: 15px;
            border: 2px solid #334155;
            border-radius: 12px;
            background: #1e293b;
            color: white;
            font-size: 1.1em;
            text-align: center;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .input-nombre:focus {
            outline: none;
            border-color: var(--gold);
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #dc2626);
            color: white;
            font-size: 1.1em;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #b91c1c);
            color: white;
        }

        .error-msg {
            background: var(--danger);
            color: white;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.9em;
        }

        /* Pantalla de juego */
        .game-screen {
            display: none;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .info-card {
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 12px;
            text-align: center;
            flex: 1;
            min-width: 80px;
            border: 1px solid #2d3436;
        }

        .info-value {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--gold);
        }

        .info-label {
            font-size: 0.7em;
            color: #94a3b8;
        }

        /* Cartón */
        .carton-container {
            background: white;
            border-radius: 16px;
            padding: 8px;
            margin-bottom: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .carton-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 4px;
        }

        .carton-header-cell {
            background: var(--primary);
            color: white;
            padding: 12px 4px;
            text-align: center;
            font-weight: 900;
            font-size: 1.2em;
            border-radius: 8px;
        }

        .carton-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .carton-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1em;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .carton-cell:active { transform: scale(0.95); }

        .carton-cell.marked {
            background: var(--success) !important;
            color: white !important;
            border-color: #059669 !important;
        }

        .carton-cell.free {
            background: #fef3c7 !important;
            border-color: var(--gold) !important;
            font-size: 0.8em;
        }

        .carton-cell.patron-cell {
            border: 2px dashed var(--gold);
            background: #fef9e7;
        }

        .carton-cell.ultima-cantada {
            animation: popCell 0.4s ease-out;
        }

        @keyframes popCell {
            0% { transform: scale(0.5); }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Últimos números */
        .ultimos-numeros {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 15px;
        }

        .bola-numero {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85em;
            animation: bolaEntrada 0.4s ease-out;
        }

        @keyframes bolaEntrada {
            0% { transform: scale(0) rotate(-180deg); }
            100% { transform: scale(1) rotate(0); }
        }

        /* Botón BINGO */
        .bingo-btn-container {
            text-align: center;
            margin: 15px 0;
        }

        .btn-bingo {
            background: linear-gradient(135deg, var(--danger), #b91c1c);
            color: white;
            font-size: 1.3em;
            padding: 16px;
            width: 100%;
            animation: glowBingo 1.5s infinite;
        }

        @keyframes glowBingo {
            0%, 100% { box-shadow: 0 0 15px rgba(239,68,68,0.5); }
            50% { box-shadow: 0 0 30px rgba(239,68,68,0.8); }
        }

        /* Mensaje admin */
        .admin-mensaje {
            background: var(--card-bg);
            border-left: 4px solid var(--gold);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9em;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            width: 100%;
            max-width: 350px;
            border: 2px solid var(--gold);
        }

        .modal-content h2 {
            color: var(--gold);
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        /* Confeti */
        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -20px;
            animation: confettiFall 3s linear forwards;
            z-index: 200;
        }

        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9em;
            z-index: 300;
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎱 BINGO</h1>
            <div class="sala-badge">
                Sala: <span id="salaNombre">-</span>
                <span class="connection-dot online" id="connectionDot"></span>
            </div>
        </div>

        <!-- Pantalla de Login -->
        <div id="loginScreen" class="login-screen">
            <div class="icon">🎮</div>
            <h2>¡Bienvenido!</h2>
            <p>Ingresa tu nombre para unirte a la partida</p>
            <input type="text" id="nombreInput" class="input-nombre" placeholder="Tu nombre" maxlength="20" autocomplete="off">
            <button class="btn btn-primary" onclick="unirseAlJuego()">🎯 UNIRME AL JUEGO</button>
            <div id="loginError"></div>
        </div>

        <!-- Pantalla de Juego -->
        <div id="gameScreen" class="game-screen">
            <!-- Info -->
            <div class="game-info">
                <div class="info-card">
                    <div class="info-value" id="jugadoresCount">0</div>
                    <div class="info-label">Jugadores</div>
                </div>
                <div class="info-card">
                    <div class="info-value" id="cantadosCount">0</div>
                    <div class="info-label">Cantados</div>
                </div>
                <div class="info-card">
                    <div class="info-value" id="cronometroDisplay">--</div>
                    <div class="info-label">Tiempo</div>
                </div>
            </div>

            <!-- Mensaje del admin -->
            <div id="adminMensaje" class="admin-mensaje" style="display:none;"></div>

            <!-- Últimos números -->
            <div class="ultimos-numeros" id="ultimosNumeros"></div>

            <!-- Cartón -->
            <div class="carton-container" id="cartonContainer">
                <div class="carton-header">
                    <div class="carton-header-cell">B</div>
                    <div class="carton-header-cell">I</div>
                    <div class="carton-header-cell">N</div>
                    <div class="carton-header-cell">G</div>
                    <div class="carton-header-cell">O</div>
                </div>
                <div class="carton-grid" id="cartonGrid"></div>
            </div>

            <!-- Botón BINGO -->
            <div class="bingo-btn-container">
                <button class="btn btn-bingo" onclick="cantarBingo()">🎉 ¡BINGO!</button>
            </div>

            <!-- Botón salir -->
            <button class="btn btn-danger" onclick="salirDelJuego()" style="margin-top:10px;">🚪 Salir</button>
        </div>
    </div>

    <!-- Modal confirmación -->
    <div class="modal-overlay" id="modalConfirmar">
        <div class="modal-content">
            <h2>🎉 ¿Cantar BINGO?</h2>
            <p>¿Estás seguro de que completaste el patrón?</p>
            <div class="modal-buttons">
                <button class="btn btn-success" onclick="confirmarBingo()">✅ Sí, BINGO</button>
                <button class="btn btn-danger" onclick="cerrarModal()">❌ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal ganador -->
    <div class="modal-overlay" id="modalGanador">
        <div class="modal-content">
            <h2>🏆 ¡GANASTE!</h2>
            <p id="ganadorMensaje"></p>
            <button class="btn btn-primary" onclick="cerrarModal()">🎉 Cerrar</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============ CONFIGURACIÓN FIREBASE (MISMO PROYECTO QUE LA RULETA) ============
        const firebaseConfig = {
            apiKey: "AIzaSyAOHYo0w41dV6TRarAaGt58Zxn4o47dNUE",
            authDomain: "bingofast.firebaseapp.com",
            databaseURL: "https://bingofast-default-rtdb.firebaseio.com",
            projectId: "bingofast",
            storageBucket: "bingofast.firebasestorage.app",
            messagingSenderId: "473863283329",
            appId: "1:473863283329:web:2c4bf96de167d105fa6380"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        console.log('🔥 Firebase conectado');

        // ============ OBTENER SALA DE LA URL ============
        function obtenerSalaDeURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('sala') || null;
        }

        const SALA_ID = obtenerSalaDeURL();

        // Mostrar sala
        if (SALA_ID) {
            document.getElementById('salaNombre').textContent = SALA_ID;
        } else {
            document.getElementById('salaNombre').textContent = 'No asignada';
            document.getElementById('loginScreen').innerHTML = `
                <div class="icon">⚠️</div>
                <h2>Sala no encontrada</h2>
                <p style="color:#94a3b8;">Solicita un enlace válido al administrador del juego.</p>
                <div class="error-msg">La URL debe incluir ?sala=ID_SALA</div>
            `;
        }

        // ============ VARIABLES ============
        let miNombre = null;
        let miCarton = null;
        let miCartonId = null;
        let cantadosSet = new Set();
        let patronActual = [];
        let juegoConectado = false;

        // ============ CONEXIÓN ============
        function actualizarEstadoConexion(online) {
            const dot = document.getElementById('connectionDot');
            dot.className = 'connection-dot ' + (online ? 'online' : 'offline');
        }

        // Monitorear conexión
        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            actualizarEstadoConexion(snap.val() === true);
        });

        // ============ UNIRSE AL JUEGO ============
        async function unirseAlJuego() {
            const nombre = document.getElementById('nombreInput').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (!nombre) {
                errorDiv.innerHTML = '<div class="error-msg">Ingresa tu nombre</div>';
                return;
            }

            if (!SALA_ID) {
                errorDiv.innerHTML = '<div class="error-msg">No hay sala asignada</div>';
                return;
            }

            // Verificar que el nombre no esté duplicado en esta sala
            const cartonesSnapshot = await db.ref('salas/' + SALA_ID + '/cartones').once('value');
            const cartones = cartonesSnapshot.val() || {};
            
            let nombreEnUso = false;
            let cartonAsignado = null;
            let cartonIdAsignado = null;

            // Buscar si el jugador ya tiene un cartón asignado
            Object.entries(cartones).forEach(([id, carton]) => {
                if (carton.asignadoA === nombre) {
                    nombreEnUso = true;
                    cartonAsignado = carton;
                    cartonIdAsignado = id;
                }
            });

            if (!nombreEnUso) {
                // Buscar un cartón no asignado para dárselo
                let cartonLibre = null;
                let cartonLibreId = null;

                Object.entries(cartones).forEach(([id, carton]) => {
                    if (!carton.asignadoA && !cartonLibre) {
                        cartonLibre = carton;
                        cartonLibreId = id;
                    }
                });

                if (cartonLibre) {
                    // Asignar este cartón al jugador
                    await db.ref('salas/' + SALA_ID + '/cartones/' + cartonLibreId).update({
                        asignadoA: nombre,
                        estado: 'asignado'
                    });
                    cartonAsignado = cartonLibre;
                    cartonIdAsignado = cartonLibreId;
                } else {
                    errorDiv.innerHTML = '<div class="error-msg">No hay cartones disponibles. Contacta al administrador.</div>';
                    return;
                }
            }

            // Guardar datos
            miNombre = nombre;
            miCarton = cartonAsignado.carton;
            miCartonId = cartonIdAsignado;
            juegoConectado = true;

            // Guardar en localStorage por si recarga
            localStorage.setItem('bingo_jugador_nombre', nombre);
            localStorage.setItem('bingo_jugador_sala', SALA_ID);
            localStorage.setItem('bingo_jugador_cartonId', cartonIdAsignado);

            // Mostrar juego
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';

            // Inicializar
            mostrarCarton(miCarton);
            escucharPartida();
            escucharChat();
            mostrarToast('✅ Conectado como ' + nombre, 'success');
        }

        // ============ MOSTRAR CARTÓN ============
        function mostrarCarton(carton) {
            const grid = document.getElementById('cartonGrid');
            grid.innerHTML = '';

            const letras = ['B', 'I', 'N', 'G', 'O'];

            for (let fila = 0; fila < 5; fila++) {
                for (let col = 0; col < 5; col++) {
                    const letra = letras[col];
                    const valor = carton[letra][fila];
                    const esCentro = (letra === 'N' && fila === 2);
                    
                    const cell = document.createElement('div');
                    cell.className = 'carton-cell';
                    cell.textContent = esCentro ? '⭐' : valor;
                    cell.dataset.valor = valor;
                    cell.dataset.letra = letra;
                    cell.dataset.fila = fila;
                    cell.dataset.col = col;
                    cell.dataset.indice = fila * 5 + col;

                    if (esCentro) {
                        cell.classList.add('free', 'marked');
                    }

                    cell.addEventListener('click', () => toggleCelda(cell));
                    grid.appendChild(cell);
                }
            }

            actualizarCeldasPatron();
        }

        function toggleCelda(cell) {
            const valor = parseInt(cell.dataset.valor);
            if (isNaN(valor)) return;
            
            if (cantadosSet.has(valor)) {
                cell.classList.toggle('marked');
            }
        }

        function actualizarCeldasPatron() {
            if (!patronActual || patronActual.length === 0) return;
            
            const celdas = document.querySelectorAll('.carton-cell');
            celdas.forEach(cell => {
                const indice = parseInt(cell.dataset.indice);
                if (patronActual[indice] && !cell.classList.contains('free')) {
                    cell.classList.add('patron-cell');
                }
            });
        }

        // ============ ESCUCHAR PARTIDA ============
        function escucharPartida() {
            const partidaRef = db.ref('partidas/' + SALA_ID);

            partidaRef.on('value', (snap) => {
                const data = snap.val();
                if (!data) return;

                // Actualizar números cantados
                if (data.cantados && Array.isArray(data.cantados)) {
                    data.cantados.forEach(num => {
                        if (!cantadosSet.has(num)) {
                            cantadosSet.add(num);
                            marcarNumeroEnCarton(num);
                        }
                    });
                    document.getElementById('cantadosCount').textContent = data.cantados.length;
                    actualizarUltimosNumeros(data.cantados);
                }

                // Actualizar patrón
                if (data.patron && Array.isArray(data.patron)) {
                    patronActual = data.patron;
                    actualizarCeldasPatron();
                }

                // Actualizar jugadores
                if (data.jugadoresActivos && Array.isArray(data.jugadoresActivos)) {
                    document.getElementById('jugadoresCount').textContent = data.jugadoresActivos.length;
                }

                // Mensaje del admin
                if (data.mensajeAdmin) {
                    const msgDiv = document.getElementById('adminMensaje');
                    msgDiv.style.display = 'block';
                    msgDiv.textContent = '📢 ' + data.mensajeAdmin;
                    setTimeout(() => { msgDiv.style.display = 'none'; }, 5000);
                }

                // Cronómetro
                if (data.cronometro && data.cronometro > 0) {
                    const mins = Math.floor(data.cronometro / 60);
                    const segs = data.cronometro % 60;
                    document.getElementById('cronometroDisplay').textContent = 
                        String(mins).padStart(2, '0') + ':' + String(segs).padStart(2, '0');
                } else if (data.estado === 'jugando') {
                    document.getElementById('cronometroDisplay').textContent = '▶️';
                }

                // Resultado de revisión
                if (data.resultadoRevision) {
                    const revision = data.resultadoRevision;
                    if (revision.jugador === miNombre) {
                        if (revision.resultado === 'valido') {
                            lanzarConfeti();
                            document.getElementById('ganadorMensaje').textContent = 
                                '¡Felicidades ' + miNombre + '! Tu BINGO fue validado 🎉';
                            document.getElementById('modalGanador').classList.add('active');
                        } else if (revision.resultado === 'errado') {
                            mostrarToast('❌ BINGO ERRADO. Revisa tu cartón.', 'error');
                        }
                    }
                }

                // Revisando
                if (data.revisando && data.revisando.activo && data.revisando.jugador === miNombre) {
                    mostrarToast('🔍 El administrador está revisando tu cartón...', 'success');
                }
            });

            // Escuchar bingos
            db.ref('bingos/' + SALA_ID).on('child_added', (snap) => {
                const bingo = snap.val();
                // Verificar si es nuestro cartón
                if (bingo.cartonId === miCartonId) {
                    // Ya se procesa en resultadoRevision
                }
            });
        }

        function marcarNumeroEnCarton(numero) {
            const celdas = document.querySelectorAll('.carton-cell');
            celdas.forEach(cell => {
                if (parseInt(cell.dataset.valor) === numero) {
                    cell.classList.add('marked', 'ultima-cantada');
                    setTimeout(() => cell.classList.remove('ultima-cantada'), 500);
                }
            });
        }

        function actualizarUltimosNumeros(cantados) {
            const container = document.getElementById('ultimosNumeros');
            const ultimos = cantados.slice(-6).reverse();
            
            container.innerHTML = '';
            ultimos.forEach(num => {
                const bola = document.createElement('div');
                bola.className = 'bola-numero';
                bola.textContent = num;
                container.appendChild(bola);
            });
        }

        // ============ VERIFICAR BINGO ============
        function verificarBingoLocal() {
            if (!miCarton || !patronActual || patronActual.length === 0) return false;

            const letras = ['B', 'I', 'N', 'G', 'O'];
            
            for (let i = 0; i < 25; i++) {
                if (!patronActual[i]) continue; // Esta celda no es parte del patrón
                
                if (i === 12) continue; // Centro libre
                
                const fila = Math.floor(i / 5);
                const col = i % 5;
                const letra = letras[col];
                const valor = miCarton[letra][fila];
                
                if (!cantadosSet.has(valor)) {
                    return false; // Falta este número
                }
            }
            
            return true; // Todas las celdas del patrón están cantadas
        }

        function cantarBingo() {
            if (!verificarBingoLocal()) {
                mostrarToast('❌ Aún no completas el patrón. Revisa tu cartón.', 'error');
                return;
            }
            
            document.getElementById('modalConfirmar').classList.add('active');
        }

        async function confirmarBingo() {
            document.getElementById('modalConfirmar').classList.remove('active');
            
            try {
                // Registrar bingo en Firebase
                await db.ref('bingos/' + SALA_ID).push({
                    cartonId: miCartonId,
                    jugador: miNombre,
                    timestamp: Date.now()
                });

                mostrarToast('🎉 BINGO cantado. Esperando validación...', 'success');
            } catch (error) {
                console.error('Error al cantar bingo:', error);
                mostrarToast('Error al cantar bingo', 'error');
            }
        }

        function cerrarModal() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        }

        // ============ CHAT ============
        function escucharChat() {
            db.ref('partidas/' + SALA_ID + '/chat').limitToLast(20).on('value', () => {
                // El chat se muestra en la ruleta, aquí solo escuchamos
            });
        }

        // ============ SALIR ============
        async function salirDelJuego() {
            if (!juegoConectado) return;
            
            if (confirm('¿Salir del juego?')) {
                // Liberar cartón
                if (miCartonId) {
                    await db.ref('salas/' + SALA_ID + '/cartones/' + miCartonId).update({
                        asignadoA: null,
                        estado: 'disponible'
                    });
                }

                // Limpiar
                juegoConectado = false;
                miNombre = null;
                miCarton = null;
                miCartonId = null;
                cantadosSet.clear();
                localStorage.clear();

                document.getElementById('gameScreen').style.display = 'none';
                document.getElementById('loginScreen').style.display = 'block';
                document.getElementById('nombreInput').value = '';
                document.getElementById('cartonGrid').innerHTML = '';
                document.getElementById('ultimosNumeros').innerHTML = '';
            }
        }

        // ============ EFECTOS ============
        function lanzarConfeti() {
            const colores = ['#FF6B6B', '#4ECDC4', '#FFD700', '#FF8C00', '#FF1493', '#10b981'];
            
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti-piece';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
                    confetti.style.width = Math.random() * 12 + 6 + 'px';
                    confetti.style.height = Math.random() * 12 + 6 + 'px';
                    confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3500);
                }, i * 15);
            }
        }

        function mostrarToast(mensaje, tipo) {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast ' + (tipo || '');
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============ INICIALIZACIÓN ============
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🎱 Bingo Jugador - Sala:', SALA_ID);
            
            // Intentar reconectar si ya estaba jugando
            const nombreGuardado = localStorage.getItem('bingo_jugador_nombre');
            const salaGuardada = localStorage.getItem('bingo_jugador_sala');
            const cartonIdGuardado = localStorage.getItem('bingo_jugador_cartonId');
            
            if (nombreGuardado && salaGuardada === SALA_ID && cartonIdGuardado) {
                // Reconectar automáticamente
                document.getElementById('nombreInput').value = nombreGuardado;
                // Cargar cartón desde Firebase
                db.ref('salas/' + SALA_ID + '/cartones/' + cartonIdGuardado).once('value', (snap) => {
                    const carton = snap.val();
                    if (carton && carton.asignadoA === nombreGuardado) {
                        miNombre = nombreGuardado;
                        miCarton = carton.carton;
                        miCartonId = cartonIdGuardado;
                        juegoConectado = true;
                        
                        document.getElementById('loginScreen').style.display = 'none';
                        document.getElementById('gameScreen').style.display = 'block';
                        
                        mostrarCarton(miCarton);
                        escucharPartida();
                        escucharChat();
                        mostrarToast('✅ Reconectado como ' + miNombre, 'success');
                    }
                });
            }

            // Enter para unirse
            document.getElementById('nombreInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') unirseAlJuego();
            });
        });

        // Cerrar modales al hacer clic fuera
        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) cerrarModal();
            });
        });

        // Manejar desconexión
        window.addEventListener('beforeunload', () => {
            if (juegoConectado && miCartonId) {
                db.ref('salas/' + SALA_ID + '/cartones/' + miCartonId).update({
                    asignadoA: null,
                    estado: 'disponible'
                });
            }
        });
    </script>
</body>
</html>
